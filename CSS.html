<style>
/*
   DA ChaouiEngage : Gold (#D4AF37), Black (#000), White (#FFF)
   Classy, Dark Mode, Minimalist
*/

:root {
  --gold: #D4AF37;
  --black: #121212;
  --dark-gray: #1E1E1E;
  --light-gray: #333;
  --white: #E0E0E0;
  --text-color: #E0E0E0;
  --bg-color: #000000;
  --bubble-me: #2A3B2A; /* Slight Greenish tint for me */
  --bubble-them: #1E1E1E;
}

body {
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-color);
  height: 100vh;
  overflow: hidden; /* Prevent body scroll, handle in views */
  user-select: none; /* Anti-Copy */
  -webkit-user-select: none;
}

/* ANTI-SCREENSHOT (Blur on Focus Lost) */
body.blurred {
  filter: blur(10px);
}

#app {
  width: 100%;
  height: 100%;
  position: relative;
}

/* UTILS */
.hidden { display: none !important; }
.view {
  display: none;
  width: 100%;
  height: 100%;
  flex-direction: column;
}
.view.active { display: flex; }

/* AUTH SCREENS */
.auth-box {
  margin: auto;
  width: 90%;
  max-width: 400px;
  text-align: center;
  padding: 30px;
  background: var(--dark-gray);
  border: 1px solid var(--gold);
  border-radius: 8px;
}

.auth-box h1 { color: var(--gold); margin-bottom: 20px; }
.auth-box input, select {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  background: #000;
  border: 1px solid #444;
  color: #fff;
  border-radius: 4px;
  box-sizing: border-box;
}
.auth-box input:focus { border-color: var(--gold); outline: none; }

button {
  cursor: pointer;
  border: none;
  padding: 10px 20px;
  border-radius: 4px;
  font-weight: bold;
  transition: 0.2s;
}

.btn-primary {
  background-color: var(--gold);
  color: #000;
  width: 100%;
  padding: 12px;
  font-size: 16px;
}
.btn-primary:hover { opacity: 0.9; }

.link {
  color: var(--gold);
  margin-top: 15px;
  cursor: pointer;
  text-decoration: underline;
  font-size: 14px;
}

/* HEADER */
.header {
  height: 60px;
  background-color: var(--dark-gray);
  border-bottom: 1px solid var(--gold);
  display: flex;
  align-items: center;
  padding: 0 15px;
  justify-content: space-between;
}
.header .title {
  color: var(--gold);
  font-weight: bold;
  font-size: 18px;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo-header {
  height: 40px;
  cursor: pointer;
}
.header button {
  background: transparent;
  color: var(--gold);
  border: 1px solid var(--gold);
  padding: 5px 10px;
  font-size: 12px;
}
.chat-info {
  flex: 1;
  text-align: center;
  font-size: 14px;
  display: flex;
  flex-direction: column;
}
#chat-timer {
  color: #ff4444;
  font-size: 12px;
}

/* MAIN CONTENT */
.main-content {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
}

.btn-new-chat {
  width: 100%;
  background: var(--dark-gray);
  color: var(--gold);
  border: 1px dashed var(--gold);
  padding: 15px;
  margin-bottom: 20px;
}

.list-container .item {
  background: var(--dark-gray);
  padding: 15px;
  margin-bottom: 10px;
  border-radius: 4px;
  cursor: pointer;
  border-left: 3px solid transparent;
}
.list-container .item:hover { border-left-color: var(--gold); }
.list-container .item .name { font-weight: bold; color: #fff; }
.list-container .item .meta { font-size: 12px; color: #888; margin-top: 4px; }

/* MESSAGES */
.messages-area {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background-image: url('data:image/svg+xml;base64,...'); /* Optional pattern */
}

.msg {
  max-width: 80%;
  padding: 10px;
  border-radius: 8px;
  font-size: 14px;
  position: relative;
  word-wrap: break-word;
}
.msg.me {
  align-self: flex-end;
  background-color: var(--bubble-me);
  color: #fff;
  border-bottom-right-radius: 0;
}
.msg.them {
  align-self: flex-start;
  background-color: var(--bubble-them);
  color: #ddd;
  border-bottom-left-radius: 0;
}
.msg .sender {
  font-size: 10px;
  color: var(--gold);
  margin-bottom: 2px;
  display: block;
}
.msg img {
  max-width: 100%;
  border-radius: 4px;
  margin-top: 5px;
}

/* INPUT AREA */
.input-area {
  padding: 10px;
  background: var(--dark-gray);
  display: flex;
  gap: 10px;
}
.input-area input[type=text] {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: none;
  background: #000;
  color: #fff;
}
.btn-icon {
  background: none;
  color: var(--gold);
  font-size: 20px;
  padding: 0 10px;
}
.btn-send {
  background: var(--gold);
  color: #000;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* SPINNER */
.spinner {
  border: 4px solid #f3f3f3;
  border-top: 4px solid var(--gold);
  border-radius: 50%;
  width: 30px;
  height: 30px;
  animation: spin 1s linear infinite;
  margin: 20px auto;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

#loading {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.8);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
</style>
