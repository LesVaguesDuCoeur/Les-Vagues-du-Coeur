<style>
/* =========================================
   VARIABLES & RESET
   ========================================= */
:root {
  --gold: #D4AF37;
  --gold-dark: #aa8c2c;
  --black: #000000;
  --dark-grey: #1a1a1a;
  --light-grey: #2d2d2d;
  --text-white: #ffffff;
  --text-muted: #b3b3b3;
  --danger: #ff4444;
  --msg-me: #D4AF37;
  --msg-other: #2d2d2d;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

body {
  background-color: var(--black);
  color: var(--text-white);
  height: 100vh;
  overflow: hidden; /* App feel */
  -webkit-user-select: none; /* Anti-select */
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}

/* Anti-Screenshot Blur Effect */
body.blurred {
  filter: blur(10px);
  pointer-events: none;
}

/* =========================================
   COMMON LAYOUT
   ========================================= */
.view {
  display: none;
  flex-direction: column;
  height: 100%;
  width: 100%;
  position: absolute;
  top: 0;
  left: 0;
}

.view.active {
  display: flex;
}

.hidden { display: none !important; }

.app-header {
  height: 60px;
  background-color: var(--dark-grey);
  border-bottom: 1px solid var(--gold);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
  z-index: 100;
}

.header-left, .header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.app-logo { width: 80px; height: 80px; object-fit: contain; margin-bottom: 20px; }
.app-logo-small { width: 40px; height: 40px; object-fit: contain; border-radius: 50%; border: 1px solid var(--gold); }

.content-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  background-color: var(--black);
}

.content-area.centered {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* =========================================
   BUTTONS & INPUTS
   ========================================= */
.gold-btn {
  background-color: var(--gold);
  color: var(--black);
  border: none;
  padding: 12px 24px;
  border-radius: 5px;
  font-weight: bold;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 1px;
  transition: background 0.2s;
}
.gold-btn:hover { background-color: var(--gold-dark); }

.gold-btn-small {
  background-color: var(--gold);
  color: var(--black);
  border: none;
  padding: 5px 10px;
  border-radius: 3px;
  font-size: 0.8rem;
  font-weight: bold;
  cursor: pointer;
}

.icon-btn {
  background: none;
  border: none;
  color: var(--gold);
  font-size: 1.5rem;
  cursor: pointer;
}

input {
  background-color: var(--light-grey);
  border: 1px solid var(--dark-grey);
  color: var(--text-white);
  padding: 12px;
  border-radius: 5px;
  outline: none;
  width: 100%;
  margin-bottom: 15px;
}
input:focus { border-color: var(--gold); }

/* =========================================
   AUTH VIEW
   ========================================= */
.auth-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  text-align: center;
  padding: 20px;
}

.logo-area h1 {
  color: var(--gold);
  font-size: 2.5rem;
  margin-bottom: 5px;
  letter-spacing: 2px;
}

.subtitle { color: var(--text-muted); margin-bottom: 40px; }

.auth-form {
  width: 100%;
  max-width: 350px;
  background-color: var(--dark-grey);
  padding: 30px;
  border-radius: 10px;
  border: 1px solid var(--gold);
}

.auth-form h2 { color: var(--gold); margin-bottom: 20px; }

.switch-link {
  margin-top: 15px;
  color: var(--text-muted);
  cursor: pointer;
  text-decoration: underline;
  font-size: 0.9rem;
}

.info-text { font-size: 0.8rem; color: var(--gold); margin-bottom: 10px; }

/* =========================================
   DASHBOARD / LIST
   ========================================= */
.list-container { max-width: 800px; margin: 0 auto; }

.chat-item {
  background-color: var(--dark-grey);
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 10px;
  cursor: pointer;
  border-left: 3px solid transparent;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.chat-item:hover { background-color: var(--light-grey); border-left-color: var(--gold); }

.chat-info h4 { color: var(--text-white); margin-bottom: 5px; }
.chat-preview { color: var(--text-muted); font-size: 0.9rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 200px; }
.chat-meta { text-align: right; font-size: 0.8rem; color: var(--text-muted); }
.expires-badge { color: var(--danger); font-size: 0.75rem; display: block; margin-top: 3px; }

/* =========================================
   NEW CHAT VIEW
   ========================================= */
.form-box {
  width: 100%;
  max-width: 500px;
  background-color: var(--dark-grey);
  padding: 30px;
  border-radius: 10px;
}
.form-box label { display: block; color: var(--gold); margin-bottom: 8px; text-align: left; }
.duration-options { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.dur-btn {
  flex: 1;
  background: var(--light-grey);
  border: 1px solid var(--dark-grey);
  color: var(--text-muted);
  padding: 8px;
  border-radius: 4px;
  cursor: pointer;
}
.dur-btn.selected { background: var(--gold); color: var(--black); border-color: var(--gold); }
.full-width { width: 100%; }

/* =========================================
   CHAT ROOM
   ========================================= */
.messages-area {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); /* Subtle whatsapp dark pattern if possible, else solid black */
  background-blend-mode: soft-light;
}

.message-bubble {
  max-width: 70%;
  padding: 10px 15px;
  border-radius: 10px;
  position: relative;
  word-wrap: break-word;
}

.message-bubble.me {
  align-self: flex-end;
  background-color: var(--msg-me);
  color: var(--black);
  border-top-right-radius: 0;
}

.message-bubble.other {
  align-self: flex-start;
  background-color: var(--msg-other);
  color: var(--text-white);
  border-top-left-radius: 0;
}

.msg-sender { font-size: 0.75rem; color: #555; margin-bottom: 3px; font-weight: bold; }
.message-bubble.other .msg-sender { color: var(--gold); }

.msg-img { max-width: 100%; border-radius: 5px; margin-top: 5px; }
.msg-time { font-size: 0.7rem; text-align: right; margin-top: 5px; opacity: 0.7; }

.chat-input-area {
  background-color: var(--dark-grey);
  padding: 10px 15px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.attach-btn { font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }
.send-btn {
  background-color: var(--gold);
  border: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
}
.chat-input-area input[type="text"] { margin-bottom: 0; }

/* =========================================
   ADMIN TABLE
   ========================================= */
table { width: 100%; border-collapse: collapse; margin-top: 15px; }
th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--light-grey); }
th { color: var(--gold); }
.action-btn { background: var(--light-grey); border: 1px solid var(--gold); color: var(--gold); cursor: pointer; padding: 2px 8px; border-radius: 3px; }

/* =========================================
   LOADER
   ========================================= */
.loader-overlay {
  position: fixed; top:0; left:0; width:100%; height:100%;
  background: var(--black); z-index: 9999;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.spinner {
  width: 50px; height: 50px;
  border: 5px solid var(--light-grey);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { 100% { transform: rotate(360deg); } }
.loading-text { margin-top: 20px; color: var(--gold); letter-spacing: 1px; }

/* RESPONSIVE */
@media (max-width: 600px) {
  .message-bubble { max-width: 85%; }
}
</style>
