<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visioconférence Simple</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h2>Bienvenue</h2>
            <p>Entrez votre prénom pour rejoindre l'appel.</p>
            <input type="text" id="username-input" placeholder="Votre prénom...">
            <button id="join-btn">Rejoindre</button>
        </div>
    </div>

    <div class="container hidden" id="main-interface">
        <div class="video-section">
            <div id="video-grid">
                <!-- Local Video -->
                <div class="video-wrapper">
                    <video id="local-video" autoplay muted playsinline></video>
                    <span class="video-label">Moi</span>
                </div>
            </div>

            <div class="controls">
                <button id="toggle-camera" class="control-btn active">📷 Caméra ON</button>
                <button id="toggle-mic" class="control-btn active">🎤 Micro ON</button>
                <button id="copy-link" class="control-btn">🔗 Copier lien</button>
            </div>
        </div>

        <div class="chat-section">
            <div class="chat-header">Discussion</div>
            <div id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="msg-input" placeholder="Écrivez un message...">
                <button id="send-btn">Envoyer</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="client.js"></script>
</body>
</html>
