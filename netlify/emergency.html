<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urgence - Coffre-Fort</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="p-4">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-xl font-bold text-danger"><i class="fas fa-ambulance"></i> Mode Urgence</h1>
    <button class="action-btn" id="btn-logout" style="width:auto; padding:0 10px; color:var(--danger)"><i class="fas fa-sign-out-alt"></i> Quitter</button>
  </div>
  <div id="loading" class="text-center">Déchiffrement en cours...</div>
  <div id="content-container" class="hidden max-w-[800px] mx-auto flex-col gap-6">
    <div id="emergency-msg-container" class="p-4 bg-element border-l-4 border-warning rounded hidden">
      <h3 class="font-bold text-warning mb-2"><i class="fas fa-exclamation-circle"></i> Message du titulaire</h3>
      <p id="emergency-msg-content" style="white-space: pre-wrap;"></p>
    </div>
    <div class="mb-4">
      <input type="text" id="search-contact" placeholder="Rechercher un contact..." class="w-full">
    </div>
    <div id="contacts-list" class="flex-col gap-2"></div>
    <div class="mt-8">
      <button id="btn-panic" class="btn-panic"><i class="fas fa-exclamation-triangle"></i> Alerter Niveau 1</button>
      <p class="text-xs text-center text-muted mt-2">Ce bouton enverra une alerte immédiate avec votre localisation au titulaire.</p>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/emergency.js"></script>
</body>
</html>
