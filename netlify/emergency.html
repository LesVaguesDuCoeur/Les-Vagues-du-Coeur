<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accès Urgence - Coffre-Fort</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body class="p-4 md:p-8">
  <div class="flex justify-between items-center mb-8">
    <h1 class="text-2xl font-bold text-danger"><i class="fas fa-ambulance"></i> Mode Urgence</h1>
    <button class="btn btn-primary" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Quitter</button>
  </div>

  <button class="alert-level-1" onclick="triggerPanic()">
    <i class="fas fa-exclamation-triangle"></i> DÉCLENCHER ALERTE NIVEAU 1
  </button>

  <div id="urgMessageContainer" class="card hidden bg-danger bg-opacity-10 border-danger">
    <h3 class="font-bold text-danger mb-2"><i class="fas fa-info-circle"></i> Message Important</h3>
    <p id="urgMessageText" class="whitespace-pre-wrap"></p>
  </div>

  <div class="card">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold">Contacts à prévenir</h2>
      <input type="text" id="searchInput" placeholder="Rechercher un contact..." class="max-w-md" oninput="filterContacts()">
    </div>
    <div id="contactsList"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/emergency.js"></script>
</body>
</html>
