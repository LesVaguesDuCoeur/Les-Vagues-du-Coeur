<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urgence</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">Contacts d'urgence</div>
    <div class="navbar-actions">
      <button id="panic-btn" class="btn btn-panic"><i class="fas fa-exclamation-triangle"></i> Alerter Niveau 1</button>
      <button id="logout-btn" class="btn btn-secondary"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </nav>
  <div class="container">
    <div id="emergency-message-box" style="display:none; background:var(--card); border-left:4px solid var(--danger); padding:15px; border-radius:8px; margin-bottom:20px;"></div>
    <div class="search-bar">
      <input type="text" id="search-contacts" placeholder="Rechercher un contact...">
    </div>
    <div id="contacts-list"></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/emergency.js"></script>
</body>
</html>
