<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urgence - Coffre-Fort Numérique</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-bg text-text p-4 md:p-8 min-h-screen flex-col">
  <div class="max-w-4xl mx-auto w-full flex-1">
    <header class="flex justify-between items-center mb-8 pb-4 border-b border-border">
      <h1 class="text-xl font-bold text-danger"><i class="fas fa-exclamation-triangle"></i> Accès Urgence</h1>
      <button id="logoutBtn" class="btn btn-outline"><i class="fas fa-sign-out-alt"></i> Quitter</button>
    </header>
    <main>
      <div id="emergencyMessageCard" class="card mb-6 hidden border-l-4" style="border-left-color: var(--danger)">
        <h3 class="text-danger mb-2"><i class="fas fa-info-circle"></i> Instructions importantes</h3>
        <p id="emergencyMessageText" class="m-0 whitespace-pre-wrap text-sm"></p>
      </div>
      <div class="flex justify-between items-center mb-4 flex-wrap gap-4">
        <h2>Contacts à prévenir</h2>
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Rechercher..." class="form-control form-control-sm">
        </div>
      </div>
      <div id="emergencyContactsList" class="flex-col mb-8"></div>
      <div class="mt-8 flex justify-center">
        <button id="panicBtn" class="btn btn-danger btn-lg rounded-full" style="width: 120px; height: 120px; font-size: 1.5rem; box-shadow: 0 0 20px rgba(230,57,70,0.5)">
          <i class="fas fa-bullhorn mb-2"></i><br>PANIQUE
        </button>
      </div>
    </main>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/api.js"></script>
  <script src="js/emergency.js"></script>
</body>
</html>
