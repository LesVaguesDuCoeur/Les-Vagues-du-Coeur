<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urgence - Coffre-Fort</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="flex flex-col min-h-screen">
<nav class="flex items-center p-4 border-b justify-between">
<h1 class="text-xl font-bold">Urgence</h1>
<div class="flex gap-2">
<button id="panic-btn" class="p-2 rounded font-bold flex items-center gap-2 transition" style="background:var(--danger);color:var(--text);border:none;">
<i class="fas fa-exclamation-triangle"></i> ALERTER NIVEAU 1
</button>
<button id="logout-btn" class="p-2 border rounded" style="background:transparent;color:var(--text);border-color:var(--border);">Déconnexion</button>
</div>
</nav>
<main class="flex-1 p-4 flex flex-col items-center">
<div class="w-full" style="max-width:800px;">
<div id="emergency-message-display" class="mb-6 p-4 rounded hidden" style="background:rgba(230,57,70,0.1);border:1px solid var(--danger);color:var(--text);">
</div>
<input type="text" id="search-input" placeholder="Rechercher un contact..." class="w-full p-3 mb-4 rounded border" style="background:var(--bg-element);color:var(--text);border-color:var(--border);">
<div id="contacts-list" class="flex flex-col"></div>
</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/crypto.js"></script>
<script src="js/emergency.js"></script>
</body>
</html>
