<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuration - Contacts d'Urgence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Configuration Initiale</h1>

        <div class="card">
            <h2>Etape 1 : Connexion Serveur</h2>
            <p>Entrez l'URL de votre script Google Apps deploye.</p>
            <div class="form-group">
                <label>URL Google Apps Script</label>
                <input type="url" id="api-url" placeholder="https://script.google.com/macros/s/..." required>
            </div>
            <div class="form-group">
                <label>Email pour alertes d'urgence</label>
                <input type="email" id="email" placeholder="votre.email@example.com" required>
            </div>
        </div>

        <div class="card">
            <h2>Etape 2 : Mots de passe (Securite)</h2>
            <p>Definissez les 4 mots de passe cles. Ils ne pourront pas etre recuperes en cas d'oubli.</p>

            <div class="form-group">
                <label>1. Mot de passe Contact (Lecture/Ecriture des contacts)</label>
                <input type="password" id="pwd-contact" required minlength="4">
                <input type="password" id="pwd-contact-confirm" placeholder="Confirmer" required minlength="4" style="margin-top: 8px;">
            </div>

            <div class="form-group">
                <label>2. Mot de passe Admin (Acces a tous les parametres)</label>
                <input type="password" id="pwd-admin" required minlength="4">
                <input type="password" id="pwd-admin-confirm" placeholder="Confirmer" required minlength="4" style="margin-top: 8px;">
            </div>

            <div class="form-group">
                <label>3. Mot de passe Fiche Personnelle (Vault)</label>
                <input type="password" id="pwd-vault" required minlength="4">
                <input type="password" id="pwd-vault-confirm" placeholder="Confirmer" required minlength="4" style="margin-top: 8px;">
            </div>

            <div class="form-group">
                <label>4. Mot de passe Testament Numerique</label>
                <input type="password" id="pwd-testament" required minlength="4">
                <input type="password" id="pwd-testament-confirm" placeholder="Confirmer" required minlength="4" style="margin-top: 8px;">
            </div>
        </div>

        <button id="setup-btn" style="margin-bottom: 40px;">Initialiser l'application</button>
    </div>

    <!-- Scripts -->
    <script src="js/crypto.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/setup.js"></script>
</body>
</html>
