<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup - Coffre-Fort</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="flex items-center justify-center min-h-screen">
  <div class="modal-dialog">
    <h1 class="text-xl font-bold mb-6 text-center">Initialisation du Coffre-Fort</h1>
    <form id="setup-form" class="flex-col gap-4">
      <div class="flex-col gap-2">
        <label>Mot de passe Admin</label>
        <div class="flex gap-2">
          <input type="password" id="admin-pwd" required>
          <button type="button" class="action-btn" onclick="toggleVisibility(this, 'admin-pwd')"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <div class="flex-col gap-2">
        <label>Mot de passe Urgence</label>
        <div class="flex gap-2">
          <input type="password" id="emergency-pwd" required>
          <button type="button" class="action-btn" onclick="toggleVisibility(this, 'emergency-pwd')"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <div class="flex-col gap-2">
        <label>Mot de passe Vault</label>
        <div class="flex gap-2">
          <input type="password" id="vault-pwd" required>
          <button type="button" class="action-btn" onclick="toggleVisibility(this, 'vault-pwd')"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <div class="flex-col gap-2">
        <label>Mot de passe Testament</label>
        <div class="flex gap-2">
          <input type="password" id="testament-pwd" required>
          <button type="button" class="action-btn" onclick="toggleVisibility(this, 'testament-pwd')"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="mt-4" id="btn-submit">Initialiser</button>
    </form>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/setup.js"></script>
</body>
</html>
