<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Installation</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container" style="max-width: 500px; margin-top: 50px;">
    <h2 class="modal-title" style="text-align: center;">Configuration Initiale</h2>
    <div style="background: var(--card); padding: 25px; border-radius: 8px; border: 1px solid var(--border);">
      <div class="form-group">
        <label>Mot de passe Administrateur</label>
        <div class="login-input-group">
          <input type="password" id="admin-pwd">
          <button class="login-btn" onclick="toggleVisibility(this, 'admin-pwd')"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <div class="form-group">
        <label>Mot de passe Urgence</label>
        <div class="login-input-group">
          <input type="password" id="emergency-pwd">
          <button class="login-btn" onclick="toggleVisibility(this, 'emergency-pwd')"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <div class="form-group">
        <label>Mot de passe Vault</label>
        <div class="login-input-group">
          <input type="password" id="vault-pwd">
          <button class="login-btn" onclick="toggleVisibility(this, 'vault-pwd')"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <div class="form-group">
        <label>Mot de passe Testament</label>
        <div class="login-input-group">
          <input type="password" id="testament-pwd">
          <button class="login-btn" onclick="toggleVisibility(this, 'testament-pwd')"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <button id="setup-btn" class="btn btn-primary" style="width: 100%; margin-top: 15px;">Initialiser</button>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/setup.js"></script>
</body>
</html>
