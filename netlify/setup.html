<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup - Coffre-Fort Numérique</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app-container">
    <div class="login-box" style="max-width: 500px; padding: 40px;">
      <i class="fas fa-cogs" style="font-size: 3rem; color: var(--accent); margin-bottom: 20px;"></i>
      <h2 style="margin-bottom: 30px;">Configuration Initiale</h2>
      <p style="margin-bottom: 30px; color: var(--text-muted); font-size: 0.9rem;">
        Veuillez définir les 4 mots de passe principaux.
      </p>

      <div id="setup-form">
        <div class="form-group" style="text-align: left;">
          <label>Mot de passe Admin (Accès Total)</label>
          <div class="input-with-icon">
            <input type="password" id="pwd-admin" placeholder="••••••••">
            <button class="input-icon-btn" onclick="toggleVisibility(this, 'pwd-admin')"><i class="fas fa-eye"></i></button>
          </div>
        </div>

        <div class="form-group" style="text-align: left;">
          <label>Mot de passe Urgence</label>
          <div class="input-with-icon">
            <input type="password" id="pwd-emergency" placeholder="••••••••">
            <button class="input-icon-btn" onclick="toggleVisibility(this, 'pwd-emergency')"><i class="fas fa-eye"></i></button>
          </div>
        </div>

        <div class="form-group" style="text-align: left;">
          <label>Mot de passe Vault</label>
          <div class="input-with-icon">
            <input type="password" id="pwd-vault" placeholder="••••••••">
            <button class="input-icon-btn" onclick="toggleVisibility(this, 'pwd-vault')"><i class="fas fa-eye"></i></button>
          </div>
        </div>

        <div class="form-group" style="text-align: left; margin-bottom: 30px;">
          <label>Mot de passe Testament</label>
          <div class="input-with-icon">
            <input type="password" id="pwd-testament" placeholder="••••••••">
            <button class="input-icon-btn" onclick="toggleVisibility(this, 'pwd-testament')"><i class="fas fa-eye"></i></button>
          </div>
        </div>

        <button id="btn-setup" class="btn btn-primary" style="width: 100%;">
          <i class="fas fa-check"></i> Initialiser le système
        </button>
      </div>

      <div id="loading-spinner" class="hidden" style="margin-top: 20px;">
        <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--accent);"></i>
        <p style="margin-top: 10px; font-size: 0.9rem;">Configuration en cours...</p>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/setup.js"></script>
</body>
</html>
