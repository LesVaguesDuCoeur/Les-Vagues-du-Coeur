<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiche Personnelle (Vault)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <nav>
            <a href="index.html" id="back-link">← Retour</a>
            <span id="header-status"></span>
        </nav>

        <h1>Fiche Personnelle Medicale</h1>

        <div id="content-container" class="hidden">
            <div class="card">
                <form id="vault-form">
                    <h2>Informations Generales</h2>
                    <div class="form-group">
                        <label>Nom complet</label>
                        <input type="text" id="v-name">
                    </div>
                    <div class="form-group">
                        <label>Date de naissance</label>
                        <input type="date" id="v-dob">
                    </div>
                    <div class="form-group">
                        <label>Adresse</label>
                        <input type="text" id="v-address">
                    </div>
                    <div class="form-group">
                        <label>Numero de Securite Sociale</label>
                        <input type="text" id="v-ssn">
                    </div>

                    <h2 style="margin-top: 30px;">Informations Medicales</h2>
                    <div class="form-group">
                        <label>Groupe Sanguin</label>
                        <select id="v-blood">
                            <option value="">Non specifie</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Allergies</label>
                        <textarea id="v-allergies" placeholder="Medicaments, aliments..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Traitements en cours</label>
                        <textarea id="v-treatments" placeholder="Medicaments et posologie..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Medecin Traitant</label>
                        <input type="text" id="v-doctor" placeholder="Nom et numero">
                    </div>
                    <div class="form-group">
                        <label>Notes supplementaires</label>
                        <textarea id="v-notes"></textarea>
                    </div>

                    <button type="submit" id="save-btn">Sauvegarder les modifications</button>
                </form>
            </div>
        </div>

        <div class="card login-box hidden" id="login-container">
            <h2 id="login-title">Dechiffrement requis</h2>
            <p>Veuillez entrer le mot de passe "Vault" pour acceder a ces donnees.</p>

            <form id="login-form">
                <div class="form-group">
                    <input type="password" id="password" placeholder="Mot de passe Vault" required autocomplete="current-password">
                </div>
                <button type="submit">Dechiffrer</button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/crypto.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/vault.js"></script>
</body>
</html>
