<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault - Coffre-Fort Numérique</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app-container">
    <header>
      <h1><i class="fas fa-vault" style="color: var(--warning);"></i> Accès Vault</h1>

      <div class="header-actions">
        <button id="btn-logout" class="btn btn-secondary">
          <i class="fas fa-sign-out-alt"></i> Quitter
        </button>
      </div>
    </header>

    <main>
      <div id="loading-state" class="text-center p-4">
        <i class="fas fa-spinner fa-spin text-xl mb-2" style="color: var(--accent);"></i>
        <p class="text-muted">Déchiffrement des données en cours...</p>
      </div>

      <div id="content" class="hidden">
        <div class="vault-layout">
          <div class="vault-sidebar" id="vault-categories">
            <!-- Categories injected here -->
          </div>
          <div class="vault-content" id="vault-entries">
            <!-- Entries injected here -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/vault.js"></script>
</body>
</html>
