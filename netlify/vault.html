<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body class="p-4">
<div class="flex justify-between items-center mb-6">
<h1 class="text-xl font-bold m-0 text-warning"><i class="fas fa-lock"></i> Vault <span class="text-sm font-normal text-muted">(Lecture seule)</span></h1>
<div class="flex items-center gap-4">
<div class="text-sm text-muted">Fermeture: <span id="timer">15:00</span></div>
<button id="logoutBtn" class="btn btn-danger"><i class="fas fa-sign-out-alt"></i></button>
</div>
</div>

<div class="vault-container">
<div class="vault-sidebar" id="vaultSidebar"></div>
<div class="vault-content flex-col">
<h2 id="vaultCatTitle" class="text-xl font-bold mb-4 m-0"></h2>
<div id="vaultItemList" class="flex flex-col gap-2"></div>
</div>
</div>

<div id="modalContainer"></div>
<script src="js/utils.js"></script>
<script src="js/crypto.js"></script>
<script src="js/api.js"></script>
<script src="js/vault.js"></script>
</body>
</html>
