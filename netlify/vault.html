<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault - Coffre-Fort Numérique</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-bg text-text min-h-screen">
  <div class="app-container">
    <nav class="sidebar flex-col">
      <div class="sidebar-header">
        <h2 class="text-xl font-bold text-accent"><i class="fas fa-lock"></i> Vault</h2>
      </div>
      <div class="sidebar-menu flex-col gap-2 flex-1" id="vaultCategories"></div>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="btn btn-outline text-danger w-full"><i class="fas fa-sign-out-alt"></i> Quitter</button>
      </div>
    </nav>
    <main class="main-content flex-1 flex-col">
      <header class="flex justify-between items-center mb-6 border-b border-border pb-4">
        <h1 id="currentCategoryTitle" class="text-xl m-0">Catégorie</h1>
      </header>
      <div id="vaultItemsList" class="flex-col gap-4 flex-1"></div>
    </main>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/api.js"></script>
  <script src="js/vault.js"></script>
</body>
</html>
