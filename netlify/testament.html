<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testament - Coffre-Fort</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="p-4">
  <div class="flex justify-between items-center mb-6 max-w-[800px] mx-auto">
    <h1 class="text-xl font-bold text-accent"><i class="fas fa-scroll"></i> Consultation Testament</h1>
    <div class="flex gap-2">
      <button class="btn-success" id="btn-pdf-testament"><i class="fas fa-file-pdf"></i> Exporter PDF</button>
      <button class="action-btn" id="btn-logout" style="width:auto; padding:0 10px; color:var(--danger)"><i class="fas fa-sign-out-alt"></i> Quitter</button>
    </div>
  </div>

  <div id="loading" class="text-center">Déchiffrement en cours...</div>

  <div id="content-container" class="hidden max-w-[800px] mx-auto">
    <div class="bg-element border p-6 rounded mb-4" id="testament-header">
      <h3 class="font-bold border-b pb-2 mb-4 text-center">ÉTAT CIVIL</h3>
      <div id="civil-content" class="flex-col gap-2 text-muted"></div>
    </div>
    <div class="bg-white text-black p-6 rounded" id="testament-body" style="min-height: 400px;"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/testament.js"></script>
</body>
</html>
