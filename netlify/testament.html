<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testament - Coffre-Fort Numérique</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-bg text-text p-4 md:p-8 min-h-screen flex-col">
  <div class="max-w-4xl mx-auto w-full flex-1">
    <header class="flex justify-between items-center mb-8 pb-4 border-b border-border">
      <h1 class="text-xl font-bold text-accent"><i class="fas fa-scroll"></i> Testament</h1>
      <div class="flex gap-2">
        <button id="exportPdfBtn" class="btn btn-primary"><i class="fas fa-file-pdf"></i> PDF</button>
        <button id="logoutBtn" class="btn btn-outline"><i class="fas fa-sign-out-alt"></i> Quitter</button>
      </div>
    </header>
    <main>
      <div id="testamentContent" class="card bg-element">
        <div class="testament-header mb-8 text-center border-b border-border pb-4">
          <h2 class="text-2xl font-bold mb-4">TESTAMENT — DERNIÈRES VOLONTÉS</h2>
          <div id="testamentCivilState" class="text-sm text-muted"></div>
          <div id="testamentDate" class="text-sm mt-2 text-muted"></div>
        </div>
        <div id="testamentBody" class="prose max-w-none text-text"></div>
      </div>
    </main>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/api.js"></script>
  <script src="js/testament.js"></script>
</body>
</html>
