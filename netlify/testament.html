<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testament - SecurApp</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="header-actions">
            <h2>Testament Numérique</h2>
            <div class="nav-links">
                <a href="index.html" id="btn-logout" class="btn btn-secondary btn-small">Déconnexion</a>
                <a href="admin.html" id="link-admin" class="btn btn-secondary btn-small hidden">Retour Admin</a>
            </div>
        </div>

        <div id="login-box" class="login-container mt-2">
            <h3 class="mb-1">Accès Sécurisé</h3>
            <p class="mb-2">Veuillez saisir votre mot de passe TESTAMENT.</p>
            <form id="section-login-form">
                <div class="form-group">
                    <input type="password" id="section-password" placeholder="Mot de passe Testament" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary">Accéder</button>
            </form>
        </div>

        <div id="content-box" class="hidden">
            <div class="card mb-2">
                <h3>Dernières Volontés</h3>
                <p>Ce document est hautement sécurisé et chiffré. Rédigez ici vos instructions, vos volontés et autres informations importantes.</p>
                <form id="testament-form" class="mt-1">
                    <div class="form-group">
                        <label>Contenu du testament</label>
                        <textarea id="testament-content" style="min-height: 300px;"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary mt-1">Sauvegarder le Testament</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/crypto.js"></script>
    <script src="js/api.js"></script>
    <script src="js/testament.js"></script>
</body>
</html>
