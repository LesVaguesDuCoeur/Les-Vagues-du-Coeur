<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testament</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body class="dark-theme">
  <!-- TOPNAV -->
  <nav class="topnav">
    <span class="topnav-brand">Mon Espace</span>
    <div class="topnav-links">
      <a href="admin.html">Contacts</a>
      <a href="vault.html">Fiche Perso</a>
      <a href="testament.html" class="active">Testament</a>
    </div>
    <button id="btn-logout" class="btn btn-ghost">Déconnexion</button>
  </nav>

  <!-- VUE LOGIN -->
  <div id="testament-login" class="center-screen fade-in">
    <div class="login-box">
      <div class="login-icon"><i class="fas fa-scroll fa-2x"></i></div>
      <h3>Accès au Testament</h3>
      <p class="text-muted">Réservé au notaire et aux personnes désignées</p>
      <input type="text" id="t-nom" placeholder="Votre nom complet ou société" autocomplete="off" required>
      <input type="password" id="t-pwd" placeholder="Mot de passe Testament" autocomplete="off" style="margin-top:10px;">
      <input type="password" id="t-emg" placeholder="Mot de passe Urgence" autocomplete="off" style="margin-top:10px;">
      <button id="btn-testament-login" class="btn btn-primary" style="margin-top:15px; width:100%;">
        <i class="fas fa-lock-open"></i> Accéder
      </button>
      <div id="testament-error" class="error-msg hidden">Identifiants incorrects</div>
      <div id="testament-loader" class="loader hidden"></div>
    </div>
  </div>

  <!-- VUE TESTAMENT -->
  <div id="testament-data" class="hidden container fade-in" style="max-width:900px; margin:30px auto; padding:0 20px;">
    <div class="vault-header">
      <div>
        <h2>Mon Testament</h2>
        <p id="testament-viewer-info" class="text-muted" style="font-size:0.9em;"></p>
      </div>
      <div style="display:flex; gap:10px;">
        <button id="btn-testament-print" class="btn btn-ghost"><i class="fas fa-print"></i> Imprimer / PDF</button>
        <button id="btn-testament-save" class="btn btn-primary hidden"><i class="fas fa-save"></i> Enregistrer</button>
      </div>
    </div>

    <div class="vault-section">
      <div class="form-group">
        <label>Notaire désigné (optionnel)</label>
        <input type="text" id="notaire-name" placeholder="ex: Me Dupont, 75001 Paris" style="max-width:500px;">
      </div>
    </div>

    <div class="vault-section">
      <h3>Contenu du testament</h3>
      <div id="quill-editor" style="height:500px; background:#fff; color:#111; border-radius:6px;"></div>
    </div>

    <p id="testament-save-status" style="margin-top:10px; color:#888; font-size:0.9em;"></p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/testament.js"></script>
</body>
</html>
