<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testament Personnel</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand font-bold text-xl"><i class="fas fa-file-signature text-accent-main"></i> Testament</div>
        <button id="logoutBtn" class="btn btn-secondary btn-icon"><i class="fas fa-sign-out-alt"></i></button>
    </nav>

    <main class="container fade-in">
        <div class="flex justify-end mb-4">
            <button id="exportExternalTestamentBtn" class="btn btn-secondary"><i class="fas fa-file-pdf"></i> Exporter en PDF</button>
        </div>
        <div class="testament-editor">
            <div id="etatCivilContainer" class="mb-6 border-b border-gray-700 pb-4 hidden">
                <h3 class="mb-2">État civil</h3>
                <div id="etatCivilContent" class="text-muted"></div>
            </div>
            <h2 class="mb-6 pb-2">Dernières Volontés</h2>
            <div id="testamentContent" class="testament-textarea" style="white-space: pre-wrap;">
                <!-- Injected via JS -->
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/crypto.js"></script>
    <script src="js/api.js"></script>
    <script src="js/testament.js"></script>
</body>
</html>
