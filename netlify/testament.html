<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Testament</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</head>
<body class="dark-theme admin-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">Mon Espace</div>
    <ul class="sidebar-nav">
      <li><a href="#"><i class="fas fa-home"></i> Tableau de bord</a></li>
      <li><a href="admin.html"><i class="fas fa-users"></i> Contacts</a></li>
      <li><a href="vault.html"><i class="fas fa-lock"></i> Fiche Personnelle</a></li>
      <li><a href="testament_login.html" class="active"><i class="fas fa-scroll"></i> Testament</a></li>
      <li><a href="#"><i class="fas fa-cog"></i> Paramètres</a></li>
      <li style="margin-top: auto;"><a href="#" id="btn-logout"><i class="fas fa-sign-out-alt"></i> Déconnexion</a></li>
    </ul>
  </aside>

  <main class="main-content">
    <nav class="topbar">
      <h2>Mon Testament</h2>
      <div class="topbar-actions">
        <button id="btn-save" class="btn btn-primary hidden"><i class="fas fa-save"></i> Enregistrer</button>
        <button id="btn-print" class="btn btn-secondary"><i class="fas fa-print"></i> Imprimer / PDF</button>
      </div>
    </nav>

    <div class="container fade-in">
      <div id="loader" class="loader hidden"></div>

      <div class="form-group" style="margin-bottom: 20px;">
        <label>Nom du notaire désigné (Optionnel)</label>
        <input type="text" id="notaire-name" placeholder="Me Dupont" style="width: 50%;">
      </div>

      <div id="editor-container" style="height: 500px; background: white; color: black; border-radius: 4px;"></div>
      <p id="save-status" style="margin-top: 10px; color: var(--text-muted); font-size: 0.9em;"></p>
    </div>
  </main>

  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/testament.js"></script>
</body>
</html>
