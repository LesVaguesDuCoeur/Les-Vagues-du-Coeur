<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testament Numérique</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="p-4 md:p-8">
  <div class="flex justify-between items-center mb-8">
    <h1 class="text-2xl font-bold text-primary"><i class="fas fa-scroll"></i> Testament Numérique</h1>
    <div class="flex gap-2">
      <button class="btn btn-primary" onclick="exportPdf()"><i class="fas fa-file-pdf"></i> Exporter PDF</button>
      <button class="btn btn-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Quitter</button>
    </div>
  </div>

  <div class="card">
    <h3 class="font-bold mb-4 border-b border-[var(--border)] pb-2">État civil & Identité</h3>
    <div class="grid grid-cols-2 gap-4" id="identityContent"></div>
  </div>

  <div class="card mt-4">
    <h3 class="font-bold mb-4 border-b border-[var(--border)] pb-2">Dernières volontés & Directives</h3>
    <div id="testamentContent" class="mt-4"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/testament.js"></script>
</body>
</html>
