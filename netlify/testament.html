<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testament</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">Testament</div>
    <div class="navbar-actions">
      <button id="logout-btn" class="btn btn-secondary"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </nav>
  <div class="container" style="max-width:800px;">
    <div style="background:var(--card); border-radius:8px; padding:20px; border:1px solid var(--border); margin-bottom:20px;" id="identity-block">
      <h3 class="modal-title">État Civil</h3>
      <div id="identity-content" style="display:grid; grid-template-columns:1fr 1fr; gap:15px; font-size:0.95rem;"></div>
    </div>
    <div style="background:var(--card); border-radius:8px; padding:20px; border:1px solid var(--border); min-height:400px;">
      <div id="testament-content" style="line-height:1.6; font-size:1.05rem;"></div>
    </div>
    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
      <button id="export-pdf-btn" class="btn btn-primary"><i class="fas fa-file-pdf"></i> Exporter PDF</button>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/testament.js"></script>
</body>
</html>
