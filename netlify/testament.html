<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testament - Coffre-Fort</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="flex flex-col min-h-screen">
<nav class="flex items-center p-4 border-b justify-between">
<h1 class="text-xl font-bold"><i class="fas fa-scroll text-muted"></i> Testament</h1>
<div class="flex gap-2">
<button id="pdf-btn" class="p-2 rounded font-bold" style="background:var(--accent);color:var(--text);border:none;"><i class="fas fa-file-pdf"></i> PDF</button>
<button id="logout-btn" class="p-2 border rounded" style="background:transparent;color:var(--text);border-color:var(--border);">Fermer</button>
</div>
</nav>
<main class="flex-1 p-4 flex flex-col items-center">
<div class="w-full" style="max-width:800px;">
<div id="testament-content" class="p-8 rounded" style="background:white;color:black;">
</div>
</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/crypto.js"></script>
<script src="js/testament.js"></script>

</html>
