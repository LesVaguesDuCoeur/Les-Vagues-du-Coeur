<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testament - Coffre-Fort Numérique</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app-container">
    <header>
      <h1><i class="fas fa-scroll" style="color: var(--accent);"></i> Accès Testament</h1>

      <div class="header-actions">
        <button id="btn-export-pdf" class="btn btn-primary hidden">
          <i class="fas fa-file-pdf"></i> Exporter PDF
        </button>
        <button id="btn-logout" class="btn btn-secondary">
          <i class="fas fa-sign-out-alt"></i> Quitter
        </button>
      </div>
    </header>

    <main>
      <div id="loading-state" class="text-center p-4">
        <i class="fas fa-spinner fa-spin text-xl mb-2" style="color: var(--accent);"></i>
        <p class="text-muted">Déchiffrement des données en cours...</p>
      </div>

      <div id="content" class="hidden">
        <div style="background: var(--bg-element); padding: 30px; border-radius: var(--radius); margin-bottom: 20px;">
          <h2 class="text-center mb-6" style="text-transform: uppercase; letter-spacing: 2px;">Dernières Volontés</h2>

          <div id="testament-identity" style="margin-bottom: 30px; line-height: 1.8; color: #ddd; padding-bottom: 20px; border-bottom: 1px solid var(--border);">
            <!-- Identity injected here -->
          </div>

          <div id="testament-content" style="background: white; color: black; padding: 30px; border-radius: 8px; font-family: 'Arial', sans-serif; line-height: 1.6;">
            <!-- Content injected here -->
          </div>

          <div id="testament-footer" style="margin-top: 30px; text-align: right; color: var(--text-muted); font-size: 0.9rem;">
            <!-- Date injected here -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/testament.js"></script>
</body>
</html>
