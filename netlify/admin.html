<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Carnet de Contacts</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
<script src="js/utils.js"></script>
</head>
<body class="dark-theme admin-layout">
  <nav class="topnav">
    <span class="topnav-brand">Mon Espace</span>
    <div class="topnav-links">
      <a href="admin.html" class="active">Contacts</a>
      <a href="vault.html">Fiche Perso</a>
      <a href="testament.html">Testament</a>
    </div>
    <button id="btn-logout" class="btn btn-ghost">Déconnexion</button>
  </nav>

  <main class="main-content">
    <nav class="topbar">
      <h2>Contacts d'urgence</h2>
      <div class="topbar-actions">
        <input type="text" id="search-input" placeholder="Rechercher...">
        <button id="btn-add-contact" class="btn btn-primary"><i class="fas fa-plus"></i> Nouveau</button>
        <button id="btn-export" class="btn btn-secondary"><i class="fas fa-file-pdf"></i> PDF</button>
      </div>
    </nav>

    <div class="container fade-in">
      <div id="loader" class="loader hidden"></div>
    <div id="contacts-container" class="contacts-grid">
      <!-- Contacts will be dynamically inserted here -->
    </div>
  </div>

  <!-- Modal for Add/Edit Contact -->
  <div id="contact-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h2 id="modal-title">Nouveau Contact</h2>
      <form id="contact-form">
        <input type="hidden" id="contact-id">

        <div class="form-group">
          <label>Prénom / Nom *</label>
          <input type="text" id="contact-name" required>
        </div>

        <div class="form-group">
          <label>Photo (URL) - Optionnel</label>
          <input type="url" id="contact-photo" placeholder="https://...">
        </div>

        <div class="form-group">
          <label>Relation</label>
          <select id="contact-relation">
            <option value="Famille">Famille</option>
            <option value="Ami·e">Ami·e</option>
            <option value="Médecin">Médecin</option>
            <option value="Professionnel">Professionnel</option>
            <option value="Urgence">Urgence</option>
            <option value="Autre">Autre</option>
          </select>
          <input type="text" id="contact-relation-other" class="hidden" placeholder="Précisez...">
        </div>

        <div class="form-group">
          <label>Niveau d'importance (1 = Priorité absolue, 5 = Moins urgent)</label>
          <div class="importance-row">
            <label class="radio-pill">
              <input type="radio" name="importance" value="1" required>
              <span>1 - Priorité absolue</span>
            </label>
            <label class="radio-pill">
              <input type="radio" name="importance" value="2">
              <span>2</span>
            </label>
            <label class="radio-pill">
              <input type="radio" name="importance" value="3">
              <span>3</span>
            </label>
            <label class="radio-pill">
              <input type="radio" name="importance" value="4">
              <span>4</span>
            </label>
            <label class="radio-pill">
              <input type="radio" name="importance" value="5" checked>
              <span>5 - Moins urgent</span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label>Téléphone</label>
          <input type="tel" id="contact-phone">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="contact-email">
        </div>

        <div class="form-group">
          <label>WhatsApp (Numéro international)</label>
          <input type="tel" id="contact-whatsapp">
        </div>

        <div class="form-group">
          <label>Snapchat (@)</label>
          <input type="text" id="contact-snap">
        </div>

        <div class="form-group">
          <label>Instagram (@)</label>
          <input type="text" id="contact-insta">
        </div>

        <div class="form-group">
          <label>Messenger (Nom d'utilisateur)</label>
          <input type="text" id="contact-messenger">
        </div>

        <div class="form-group">
          <label>Telegram (@)</label>
          <input type="text" id="contact-telegram">
        </div>

        <div class="form-group">
          <label>TikTok (@)</label>
          <input type="text" id="contact-tiktok">
        </div>

        <div class="form-group">
          <label>LinkedIn (@)</label>
          <input type="text" id="contact-linkedin">
        </div>

        <div class="form-group">
          <label>Twitter/X (@)</label>
          <input type="text" id="contact-twitter">
        </div>

        <div class="form-group">
          <label>Site web (URL)</label>
          <input type="url" id="contact-website">
        </div>

        <div class="form-group">
          <label>Adresse (Texte libre)</label>
          <input type="text" id="contact-address">
        </div>

        <div class="form-group">
          <label>Note personnelle</label>
          <textarea id="contact-notes" rows="4"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" id="btn-save-contact">Enregistrer</button>
      </form>
    </div>
  </div>

  </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
