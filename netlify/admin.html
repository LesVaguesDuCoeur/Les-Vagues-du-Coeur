<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold m-0"><i class="fas fa-shield-alt mr-2" style="color:var(--accent);"></i> Administration</h1>
        </div>
        <button id="btn-logout" class="action-btn" title="Déconnexion"><i class="fas fa-sign-out-alt"></i></button>
    </header>

    <nav class="admin-nav" id="admin-nav">
        <button class="nav-tab active" data-tab="contacts"><i class="fas fa-address-book mr-2"></i> Contacts</button>
        <button class="nav-tab" data-tab="vault"><i class="fas fa-lock mr-2"></i> Vault</button>
        <button class="nav-tab" data-tab="testament"><i class="fas fa-scroll mr-2"></i> Testament</button>
        <button class="nav-tab" data-tab="settings"><i class="fas fa-cog mr-2"></i> Paramètres</button>
    </nav>

    <div id="loader" class="loader-container"><div class="spinner"></div></div>

    <main id="main-content" class="hidden p-4">
        <!-- Contacts Tab -->
        <section id="tab-contacts" class="tab-pane active">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl m-0">Contacts d'urgence</h2>
                <button id="btn-add-contact" class="btn-primary"><i class="fas fa-plus mr-2"></i> Ajouter</button>
            </div>
            <div id="contacts-list" class="flex-col gap-2"></div>
        </section>

        <!-- Vault Tab -->
        <section id="tab-vault" class="tab-pane hidden">
            <div class="vault-layout">
                <div class="vault-sidebar" id="vault-categories">
                    <!-- Categories injected here -->
                </div>
                <div class="vault-main">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl m-0" id="current-vault-cat-title">Catégorie</h2>
                        <button id="btn-add-vault-entry" class="btn-primary"><i class="fas fa-plus mr-2"></i> Nouvelle entrée</button>
                    </div>
                    <div id="vault-entries" class="flex-col gap-4"></div>
                </div>
            </div>
        </section>

        <!-- Testament Tab -->
        <section id="tab-testament" class="tab-pane hidden">
            <div class="max-w-4xl mx-auto" style="max-width: 800px;">
                <h2 class="text-xl mb-4"><i class="fas fa-user mr-2"></i> État civil du testateur</h2>
                <div class="form-row mb-6">
                    <div class="flex-col gap-2">
                        <label class="text-sm text-muted">Nom</label>
                        <input type="text" id="testament-nom">
                    </div>
                    <div class="flex-col gap-2">
                        <label class="text-sm text-muted">Prénom</label>
                        <input type="text" id="testament-prenom">
                    </div>
                    <div class="flex-col gap-2">
                        <label class="text-sm text-muted">Date de naissance</label>
                        <input type="date" id="testament-date-naissance" style="background: #1a1a2e; color: white; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 10px;">
                    </div>
                    <div class="flex-col gap-2">
                        <label class="text-sm text-muted">Lieu de naissance</label>
                        <input type="text" id="testament-lieu-naissance">
                    </div>
                    <div class="flex-col gap-2">
                        <label class="text-sm text-muted">Nationalité</label>
                        <input type="text" id="testament-nationalite">
                    </div>
                    <div class="flex-col gap-2" style="grid-column: 1 / -1;">
                        <label class="text-sm text-muted">Adresse complète</label>
                        <input type="text" id="testament-adresse">
                    </div>
                </div>

                <div class="flex justify-between items-center mb-4 mt-8">
                    <h2 class="text-xl m-0"><i class="fas fa-file-alt mr-2"></i> Contenu des dernières volontés</h2>
                    <div class="flex gap-4 items-center">
                        <span id="testament-status" class="text-sm text-muted"></span>
                        <button id="btn-save-testament" class="btn-primary"><i class="fas fa-save mr-2"></i> Sauvegarder</button>
                        <button id="btn-export-pdf" class="btn-secondary"><i class="fas fa-file-pdf mr-2"></i> PDF</button>
                    </div>
                </div>

                <div id="quill-container" style="height: 400px; background: #1a1a2e; color: white; border-radius: 8px; font-family: 'Inter', sans-serif;"></div>
            </div>
        </section>

        <!-- Settings Tab -->
        <section id="tab-settings" class="tab-pane hidden">
            <div style="max-width: 600px; margin: 0 auto;">
                <h2 class="text-xl mb-6">Paramètres de sécurité</h2>

                <div class="mb-8 p-4 rounded" style="background: rgba(255,255,255,0.02); border: 1px solid var(--border);">
                    <h3 class="font-bold mb-4">Message d'urgence global</h3>
                    <textarea id="settings-emergency-msg" rows="3" class="mb-4" placeholder="Ce message sera affiché en haut de la page des contacts..."></textarea>
                    <button id="btn-save-msg" class="btn-primary w-full"><i class="fas fa-save mr-2"></i> Enregistrer le message</button>
                </div>

                <div class="mb-8 p-4 rounded" style="background: rgba(255,255,255,0.02); border: 1px solid var(--border);">
                    <h3 class="font-bold mb-4"><i class="fas fa-key mr-2"></i> Changement des mots de passe</h3>
                    <div class="flex-col gap-4">
                        <input type="password" id="chg-old-admin" placeholder="Ancien mot de passe ADMIN actuel">
                        <hr style="border-color: rgba(255,255,255,0.05); margin: 8px 0;">
                        <input type="password" id="chg-new-admin" placeholder="Nouveau mdp ADMIN">
                        <input type="password" id="chg-new-urg" placeholder="Nouveau mdp URGENCE">
                        <input type="password" id="chg-new-vault" placeholder="Nouveau mdp VAULT">
                        <input type="password" id="chg-new-test" placeholder="Nouveau mdp TESTAMENT">
                        <button id="btn-change-pwd" class="btn-danger w-full mt-2"><i class="fas fa-sync-alt mr-2"></i> Modifier tous les mots de passe</button>
                    </div>
                    <p class="text-sm text-muted mt-2">Attention : Cela rechiffrera l'intégralité du coffre-fort.</p>
                </div>

                <div class="mb-8 p-4 rounded" style="background: rgba(255,255,255,0.02); border: 1px solid var(--border);">
                    <h3 class="font-bold mb-4"><i class="fas fa-history mr-2"></i> Historique des accès publics</h3>
                    <div id="access-logs" class="flex-col gap-2 text-sm max-h-64 overflow-y-auto">
                        <!-- Logs injectés -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Modals container -->
    <div id="modalContainer"></div>

    <script src="js/api.js"></script>
    <script src="js/crypto.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
