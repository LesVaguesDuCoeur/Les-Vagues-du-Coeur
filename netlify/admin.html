<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Utilitaire</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet"></head><body><header><div><i class="fas fa-shield-alt"></i> Administration</div><button id="logout-btn" style="background:transparent;border:1px solid rgba(255,255,255,0.2);">Déconnexion</button></header><main><div class="tabs"><button class="tab-btn active" data-tab="contacts"><i class="fas fa-address-book"></i> Contacts</button><button class="tab-btn" data-tab="vault"><i class="fas fa-key"></i> Vault</button><button class="tab-btn" data-tab="testament"><i class="fas fa-scroll"></i> Testament</button><button class="tab-btn" data-tab="settings"><i class="fas fa-cog"></i> Paramètres</button></div><div id="contacts" class="tab-content"><div style="display:flex;gap:1rem;margin-bottom:1rem;"><input type="text" id="search-contacts" placeholder="Rechercher..."><button id="add-contact-btn"><i class="fas fa-plus"></i> Nouveau</button></div><div id="contacts-list"></div></div><div id="vault" class="tab-content hidden"><div class="vault-container"><div class="vault-sidebar" id="vault-sidebar"></div><div class="vault-content"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;"><h2 id="vault-cat-title" style="margin:0;">-</h2><button id="add-vault-btn" class="hidden"><i class="fas fa-plus"></i></button></div><div id="vault-items"></div></div></div></div><div id="testament" class="tab-content hidden"><div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;"><input type="text" id="testament-nom" placeholder="Nom"><input type="text" id="testament-prenom" placeholder="Prénom"><input type="date" id="testament-date" placeholder="Date de naissance"><input type="text" id="testament-lieu" placeholder="Lieu de naissance"><input type="text" id="testament-nat" placeholder="Nationalité"><input type="text" id="testament-adresse" placeholder="Adresse complète"></div><div id="editor-container"></div><div style="display:flex;gap:1rem;justify-content:flex-end;"><button id="testament-pdf-btn" style="background:#555;"><i class="fas fa-file-pdf"></i> PDF</button><button id="testament-save-btn" class="btn-success"><i class="fas fa-save"></i> Sauvegarder</button></div></div><div id="settings" class="tab-content hidden"><h3>Message d'urgence global</h3><textarea id="settings-msg" rows="4"></textarea><button id="save-msg-btn" class="btn-success" style="margin-bottom:2rem;">Enregistrer message</button><h3>Sécurité</h3><div class="card"><input type="password" id="new-admin-pwd" placeholder="Nouveau mdp Admin"><input type="password" id="new-emergency-pwd" placeholder="Nouveau mdp Urgence"><input type="password" id="new-vault-pwd" placeholder="Nouveau mdp Vault"><input type="password" id="new-testament-pwd" placeholder="Nouveau mdp Testament"><button id="save-pwd-btn" class="btn-danger">Modifier tous les accès</button></div><h3>Historique (50 derniers)</h3><div id="logs-list" style="background:var(--card);padding:1rem;border-radius:8px;max-height:300px;overflow-y:auto;"></div></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script><script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script><script src="js/api.js"></script><script src="js/crypto.js"></script><script src="js/utils.js"></script><script src="js/admin.js"></script></body></html>
