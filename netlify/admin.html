<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilitaire</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="manifest" href="/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        .ql-toolbar.ql-snow { border: 1px solid rgba(255,255,255,0.1); border-radius: 8px 8px 0 0; background: var(--bg-element); }
        .ql-container.ql-snow { border: 1px solid rgba(255,255,255,0.1); border-top: none; border-radius: 0 0 8px 8px; min-height: 400px; color: white; font-family: var(--font-family); font-size: 1rem; }
        .ql-snow .ql-stroke { stroke: #fff; }
        .ql-snow .ql-fill { fill: #fff; }
        .ql-snow .ql-picker { color: #fff; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand font-bold text-xl" id="navTitle">Contacts</div>
        <div class="nav-tabs" id="navTabs">
            <div class="nav-tab active" data-target="contacts-section">
                <i class="fas fa-address-book"></i> <span class="tab-label">Contacts</span>
            </div>
            <div class="nav-tab" data-target="vault-section">
                <i class="fas fa-vault"></i> <span class="tab-label">Vault</span>
            </div>
            <div class="nav-tab" data-target="testament-section">
                <i class="fas fa-file-signature"></i> <span class="tab-label">Testament</span>
            </div>
            <div class="nav-tab" data-target="settings-section">
                <i class="fas fa-cog"></i> <span class="tab-label">Paramètres</span>
            </div>
        </div>
        <button id="logoutBtn" class="btn btn-secondary btn-icon">
            <i class="fas fa-sign-out-alt"></i>
        </button>
    </nav>

    <main class="container fade-in" id="mainContent">
        <!-- Contacts Section -->
        <section id="contacts-section" class="tab-content">
            <div class="flex justify-between items-center mb-4">
                <div class="flex gap-2">
                    <input type="text" id="contactSearch" placeholder="Rechercher..." class="w-64">
                </div>
                <div class="flex gap-2">
                    <button id="exportContactsBtn" class="btn btn-secondary"><i class="fas fa-file-pdf"></i> PDF</button>
                    <button id="addContactBtn" class="btn btn-primary"><i class="fas fa-plus"></i> Ajouter</button>
                </div>
            </div>
            <div id="contactsList" class="contact-list">
                <!-- Injected via JS -->
            </div>
        </section>

        <!-- Vault Section -->
        <section id="vault-section" class="tab-content hidden">
            <div class="vault-layout">
                <div class="vault-sidebar" id="vaultCategories">
                    <!-- Injected via JS -->
                </div>
                <div class="vault-main">
                    <div class="flex justify-between items-center mb-4">
                        <h2 id="currentCategoryTitle" class="m-0">Toutes les entrées</h2>
                        <button id="addVaultBtn" class="btn btn-primary"><i class="fas fa-plus"></i> Ajouter</button>
                    </div>
                    <div id="vaultList" class="vault-content">
                        <!-- Injected via JS -->
                    </div>
                </div>
            </div>
        </section>

        <!-- Testament Section -->
        <section id="testament-section" class="tab-content hidden">
             <div class="flex justify-between items-center mb-4">
                <div class="status-bar m-0">
                    <span id="testamentStatus">Dernière sauvegarde: Jamais</span>
                </div>
                <button id="exportTestamentBtn" class="btn btn-secondary"><i class="fas fa-file-pdf"></i> PDF</button>
            </div>
            <div class="testament-editor">
                <div id="testamentEditor"></div>
            </div>
        </section>

        <!-- Settings Section -->
        <section id="settings-section" class="tab-content hidden">
            <div class="vault-layout" style="grid-template-columns: 1fr;">
                <div class="vault-item">
                    <h3>Changer les mots de passe</h3>
                    <p class="text-sm text-muted mb-4">Modifiez vos mots de passe. Une vérification du mot de passe admin actuel est requise.</p>
                    <div class="flex gap-4">
                         <button id="changePwdBtn" class="btn btn-primary">Modifier les accès</button>
                    </div>
                </div>
                <div class="vault-item">
                    <h3>Historique des accès récents</h3>
                    <div id="accessLogsContainer" class="contact-list mt-4">
                        <!-- Injected via JS -->
                    </div>
                </div>
                 <div class="vault-item">
                    <h3>Message d'urgence global</h3>
                    <textarea id="settingsEmergencyMsg" rows="3" class="mb-2"></textarea>
                    <button id="saveEmergencyMsgBtn" class="btn btn-primary">Sauvegarder le message</button>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal Container for CRUD forms -->
    <div id="modalContainer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/crypto.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
