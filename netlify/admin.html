<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">Administration</div>
    <div class="navbar-actions">
      <button id="logout-btn" class="btn btn-secondary"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </nav>
  <div class="nav-tabs">
    <button class="nav-tab active" data-tab="contacts">Contacts</button>
    <button class="nav-tab" data-tab="vault">Vault</button>
    <button class="nav-tab" data-tab="testament">Testament</button>
    <button class="nav-tab" data-tab="settings">Paramètres</button>
  </div>
  <div class="container" id="main-container">
    <div id="tab-contacts" class="tab-content">
      <div class="search-bar">
        <input type="text" id="search-contacts" placeholder="Rechercher un contact...">
        <button id="add-contact-btn" class="btn btn-primary"><i class="fas fa-plus"></i> Nouveau</button>
      </div>
      <div id="contacts-list"></div>
    </div>
    <div id="tab-vault" class="tab-content" style="display:none;">
      <div class="vault-layout">
        <div class="vault-sidebar" id="vault-sidebar"></div>
        <div class="vault-content">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 id="vault-cat-title">Catégorie</h3>
            <button id="add-vault-btn" class="btn btn-primary"><i class="fas fa-plus"></i></button>
          </div>
          <div id="vault-items"></div>
        </div>
      </div>
    </div>
    <div id="tab-testament" class="tab-content" style="display:none;">
      <div style="background:var(--card); border-radius:8px; padding:20px; border:1px solid var(--border); margin-bottom:20px;">
        <h3 class="modal-title">État Civil</h3>
        <div class="form-row">
          <div class="form-group"><label>Nom</label><input type="text" id="testament-nom"></div>
          <div class="form-group"><label>Prénom</label><input type="text" id="testament-prenom"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Date de naissance</label><input type="date" id="testament-date"></div>
          <div class="form-group"><label>Lieu de naissance</label><input type="text" id="testament-lieu"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Nationalité</label><input type="text" id="testament-nat"></div>
          <div class="form-group"><label>Adresse</label><input type="text" id="testament-adresse"></div>
        </div>
      </div>
      <div style="background:var(--card); border-radius:8px; border:1px solid var(--border);">
        <div id="editor-container"></div>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:15px;">
        <button id="testament-pdf-btn" class="btn btn-secondary"><i class="fas fa-file-pdf"></i> Exporter PDF</button>
        <button id="testament-save-btn" class="btn btn-primary"><i class="fas fa-save"></i> Sauvegarder</button>
      </div>
    </div>
    <div id="tab-settings" class="tab-content" style="display:none;">
      <div style="background:var(--card); border-radius:8px; padding:20px; border:1px solid var(--border); margin-bottom:20px;">
        <h3 class="modal-title">Message d'Urgence</h3>
        <div class="form-group">
          <label>Ce message sera affiché à la personne qui ouvre l'accès urgence.</label>
          <textarea id="settings-msg" rows="5"></textarea>
        </div>
        <button id="save-msg-btn" class="btn btn-primary"><i class="fas fa-save"></i> Enregistrer le message</button>
      </div>
      <div style="background:var(--card); border-radius:8px; padding:20px; border:1px solid var(--border); margin-bottom:20px;">
        <h3 class="modal-title">Modification des mots de passe</h3>
        <div class="form-group">
          <label>Nouveau mot de passe Administrateur</label>
          <div class="login-input-group">
            <input type="password" id="new-admin-pwd">
            <button class="login-btn" onclick="toggleVisibility(this, 'new-admin-pwd')"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div class="form-group">
          <label>Nouveau mot de passe Urgence</label>
          <div class="login-input-group">
            <input type="password" id="new-emergency-pwd">
            <button class="login-btn" onclick="toggleVisibility(this, 'new-emergency-pwd')"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div class="form-group">
          <label>Nouveau mot de passe Vault</label>
          <div class="login-input-group">
            <input type="password" id="new-vault-pwd">
            <button class="login-btn" onclick="toggleVisibility(this, 'new-vault-pwd')"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div class="form-group">
          <label>Nouveau mot de passe Testament</label>
          <div class="login-input-group">
            <input type="password" id="new-testament-pwd">
            <button class="login-btn" onclick="toggleVisibility(this, 'new-testament-pwd')"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <button id="save-pwd-btn" class="btn btn-primary"><i class="fas fa-key"></i> Mettre à jour les mots de passe</button>
      </div>
      <div style="background:var(--card); border-radius:8px; padding:20px; border:1px solid var(--border);">
        <h3 class="modal-title">Historique des accès</h3>
        <div id="logs-list" style="max-height:300px; overflow-y:auto; font-size:0.9rem;"></div>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
