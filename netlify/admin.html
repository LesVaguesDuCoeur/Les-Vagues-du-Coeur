<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Coffre-Fort</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
  <div class="tabs p-4 mb-0" style="background: var(--panel-bg); justify-content: space-between;">
    <div class="flex gap-4">
      <button class="tab active" onclick="switchTab('contacts')"><i class="fas fa-address-book"></i> Contacts</button>
      <button class="tab" onclick="switchTab('vault')"><i class="fas fa-lock"></i> Vault</button>
      <button class="tab" onclick="switchTab('testament')"><i class="fas fa-scroll"></i> Testament</button>
      <button class="tab" onclick="switchTab('settings')"><i class="fas fa-cog"></i> Paramètres</button>
    </div>
    <button class="btn btn-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Déconnexion</button>
  </div>

  <div id="loading" class="p-8 text-center"><i class="fas fa-spinner fa-spin text-2xl"></i> Chargement et déchiffrement...</div>

  <div id="content-contacts" class="hidden p-4">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-2xl font-bold">Contacts d'Urgence</h2>
      <button class="btn btn-primary" onclick="showModal('contactModal')"><i class="fas fa-plus"></i> Ajouter</button>
    </div>
    <div id="contactsList"></div>
  </div>

  <div id="content-vault" class="hidden">
    <div class="flex" style="height: calc(100vh - 60px);">
      <div class="sidebar">
        <h3 class="font-bold mb-4">Catégories</h3>
        <div id="vaultCategories" class="flex-col gap-2"></div>
        <button class="btn btn-primary w-full mt-4" onclick="addVaultItem()"><i class="fas fa-plus"></i> Nouvel élément</button>
      </div>
      <div class="main-content" style="flex:1;">
        <h2 id="currentCategoryTitle" class="text-2xl font-bold mb-4">Sélectionnez une catégorie</h2>
        <div id="vaultItemsList"></div>
      </div>
    </div>
  </div>

  <div id="content-testament" class="hidden p-4">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-2xl font-bold">Mon Testament Numérique</h2>
      <div class="flex gap-2">
        <button class="btn btn-primary" onclick="saveTestament()"><i class="fas fa-save"></i> Sauvegarder</button>
        <button class="btn btn-primary" onclick="exportPdf()"><i class="fas fa-file-pdf"></i> PDF</button>
      </div>
    </div>
    <div class="card">
      <h3 class="font-bold mb-4">État civil & Identité</h3>
      <div class="grid grid-cols-2 gap-4" id="testamentIdentity">
        <div><label>Nom</label><input type="text" id="tNom"></div>
        <div><label>Prénom</label><input type="text" id="tPrenom"></div>
        <div><label>Date de naissance</label><input type="date" id="tNaissance"></div>
        <div><label>Lieu de naissance</label><input type="text" id="tLieu"></div>
        <div><label>Nationalité</label><input type="text" id="tNationalite"></div>
        <div><label>Adresse</label><input type="text" id="tAdresse"></div>
      </div>
    </div>
    <div class="card" style="padding:0; border:none;">
      <div id="editor"></div>
    </div>
  </div>

  <div id="content-settings" class="hidden p-4">
    <h2 class="text-2xl font-bold mb-4">Paramètres Globaux</h2>
    <div class="card max-w-md w-full" style="margin-left:0;">
      <div class="flex-col gap-4">
        <div>
          <label class="font-bold">Message d'urgence</label>
          <textarea id="settingsUrgMsg" rows="4" class="mt-2"></textarea>
          <button class="btn btn-primary mt-2" onclick="saveGlobalMessage()"><i class="fas fa-save"></i> Enregistrer</button>
        </div>
      </div>
    </div>
    <div class="card">
      <h3 class="font-bold mb-4">Historique des accès récents (Public)</h3>
      <div id="publicLogs"></div>
    </div>
  </div>

  <div id="contactModal" class="modal-overlay hidden">
    <div class="modal-content">
      <h2 class="text-xl font-bold mb-4" id="contactModalTitle">Nouveau Contact</h2>
      <form id="contactForm" class="flex-col gap-4">
        <input type="hidden" id="contactId">
        <input type="text" id="contactName" placeholder="Nom complet" required>
        <select id="contactRelation" onchange="checkRelation()"></select>
        <input type="text" id="contactRelationOther" placeholder="Précisez la relation" class="hidden">

        <div>
          <label class="font-bold">Importance (1 = Faible, 5 = Haute)</label>
          <div class="radio-group mt-2">
            <label class="radio-item"><input type="radio" name="cImp" value="1">1</label>
            <label class="radio-item"><input type="radio" name="cImp" value="2">2</label>
            <label class="radio-item"><input type="radio" name="cImp" value="3">3</label>
            <label class="radio-item"><input type="radio" name="cImp" value="4">4</label>
            <label class="radio-item"><input type="radio" name="cImp" value="5" checked>5</label>
          </div>
        </div>

        <input type="tel" id="contactTel" placeholder="Téléphone">
        <input type="email" id="contactEmail" placeholder="Email">

        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="contactWA" placeholder="Numéro WhatsApp">
          <input type="text" id="contactTG" placeholder="Username Telegram">
          <input type="text" id="contactSnap" placeholder="Username Snapchat">
          <input type="text" id="contactInsta" placeholder="Username Instagram">
          <input type="text" id="contactMessenger" placeholder="Username Messenger">
        </div>

        <textarea id="contactNotes" placeholder="Notes (ex: prévenir en premier)" rows="3"></textarea>

        <div class="flex justify-between mt-4">
          <button type="button" class="btn btn-danger" onclick="hideModal('contactModal')">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <div id="vaultItemModal" class="modal-overlay hidden">
    <div class="modal-content">
      <h2 class="text-xl font-bold mb-4" id="vaultModalTitle">Élément Vault</h2>
      <form id="vaultForm" class="flex-col gap-4">
        <div id="vaultDynamicFields" class="flex-col gap-4"></div>
        <div class="flex justify-between mt-4">
          <button type="button" class="btn btn-danger" onclick="hideModal('vaultItemModal')">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
