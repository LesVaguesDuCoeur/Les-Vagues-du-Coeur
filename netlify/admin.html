<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
.ql-toolbar { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.1) !important; border-radius: 8px 8px 0 0; }
.ql-container { border-color: rgba(255,255,255,0.1) !important; border-radius: 0 0 8px 8px; min-height: 400px; font-family: 'Inter', sans-serif; font-size: 1rem; }
.ql-editor { color: white; }
.ql-stroke { stroke: white !important; }
.ql-fill { fill: white !important; }
.ql-picker { color: white !important; }
</style>
</head>
<body class="p-4">
<div class="flex justify-between items-center mb-6">
<div class="nav-tabs m-0 border-none flex-1">
<button class="nav-tab active" data-tab="contacts"><i class="fas fa-users"></i> Contacts</button>
<button class="nav-tab" data-tab="vault"><i class="fas fa-lock"></i> Vault</button>
<button class="nav-tab" data-tab="testament"><i class="fas fa-scroll"></i> Testament</button>
<button class="nav-tab" data-tab="settings"><i class="fas fa-cog"></i> Paramètres</button>
</div>
<button id="logoutBtn" class="btn btn-danger"><i class="fas fa-sign-out-alt"></i></button>
</div>

<div id="tab-contacts" class="tab-content">
<div class="flex justify-between mb-4">
<input type="text" id="searchContacts" placeholder="Rechercher..." class="w-64">
<button class="btn btn-primary" id="addContactBtn"><i class="fas fa-plus"></i> Nouveau</button>
</div>
<div id="contactsList" class="flex-col"></div>
</div>

<div id="tab-vault" class="tab-content hidden">
<div class="vault-container">
<div class="vault-sidebar" id="vaultSidebar"></div>
<div class="vault-content flex-col">
<div class="flex justify-between mb-4">
<h2 id="vaultCatTitle" class="text-xl font-bold m-0"></h2>
<button class="btn btn-primary" id="addVaultItemBtn"><i class="fas fa-plus"></i> Ajouter</button>
</div>
<div id="vaultItemList" class="flex flex-col gap-2"></div>
</div>
</div>
</div>

<div id="tab-testament" class="tab-content hidden">
<div class="flex justify-between items-center mb-4">
<h2 class="text-xl font-bold m-0">État civil</h2>
<div class="flex gap-2">
<button class="btn btn-primary" id="saveTestamentBtn"><i class="fas fa-save"></i> Sauvegarder</button>
<button class="btn" id="exportPdfBtn"><i class="fas fa-file-pdf"></i> PDF</button>
</div>
</div>
<div class="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;">
<input type="text" id="tNom" placeholder="Nom">
<input type="text" id="tPrenom" placeholder="Prénom">
<input type="text" id="tDateNais" placeholder="Date de naissance (JJ/MM/AAAA)">
<input type="text" id="tLieuNais" placeholder="Lieu de naissance">
<input type="text" id="tNationalite" placeholder="Nationalité">
<input type="text" id="tAdresse" placeholder="Adresse complète">
</div>
<h2 class="text-xl font-bold mb-4">Dernières volontés</h2>
<div id="editor-container"></div>
<div class="text-sm text-muted mt-2 text-right" id="lastSavedTestament"></div>
</div>

<div id="tab-settings" class="tab-content hidden flex flex-col gap-6">
<div>
<h2 class="text-xl font-bold mb-4">Modifier les mots de passe</h2>
<form id="changePwdForm" class="flex flex-col gap-4" style="max-width: 400px;">
<input type="password" id="newPwdAdmin" placeholder="Nouveau mdp Admin">
<input type="password" id="newPwdUrgence" placeholder="Nouveau mdp Urgence">
<input type="password" id="newPwdVault" placeholder="Nouveau mdp Vault">
<input type="password" id="newPwdTestament" placeholder="Nouveau mdp Testament">
<button type="submit" class="btn btn-warning">Mettre à jour & Rechiffrer</button>
</form>
</div>
<div>
<h2 class="text-xl font-bold mb-4">Message d'urgence</h2>
<textarea id="emergencyMessage" rows="4" placeholder="Message affiché aux contacts d'urgence..."></textarea>
<button id="saveMsgBtn" class="btn btn-primary mt-2">Sauvegarder message</button>
</div>
<div>
<h2 class="text-xl font-bold mb-4">Historique des accès publics</h2>
<div id="accessLogsList" class="flex flex-col gap-2" style="max-height: 300px; overflow-y: auto;"></div>
</div>
</div>

<div id="modalContainer"></div>
<script src="js/utils.js"></script>
<script src="js/crypto.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
