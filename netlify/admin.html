<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Carnet de Contacts</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</head>
<body class="dark-theme admin-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">Mon Espace</div>
    <ul class="sidebar-nav">
      <li><a href="#"><i class="fas fa-home"></i> Tableau de bord</a></li>
      <li><a href="admin.html" class="active"><i class="fas fa-users"></i> Contacts</a></li>
      <li><a href="vault.html"><i class="fas fa-lock"></i> Fiche Personnelle</a></li>
      <li><a href="testament_login.html"><i class="fas fa-scroll"></i> Testament</a></li>
      <li><a href="#"><i class="fas fa-cog"></i> Paramètres</a></li>
      <li style="margin-top: auto;"><a href="#" id="btn-logout"><i class="fas fa-sign-out-alt"></i> Déconnexion</a></li>
    </ul>
  </aside>

  <main class="main-content">
    <nav class="topbar">
      <h2>Contacts d'urgence</h2>
      <div class="topbar-actions">
        <input type="text" id="search-input" placeholder="Rechercher...">
        <button id="btn-add-contact" class="btn btn-primary"><i class="fas fa-plus"></i> Nouveau</button>
        <button id="btn-export" class="btn btn-secondary"><i class="fas fa-file-pdf"></i> PDF</button>
      </div>
    </nav>

    <div class="container fade-in">
      <div id="loader" class="loader hidden"></div>
    <div id="contacts-container" class="contacts-grid">
      <!-- Contacts will be dynamically inserted here -->
    </div>
  </div>

  <!-- Modal for Add/Edit Contact -->
  <div id="contact-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h2 id="modal-title">Nouveau Contact</h2>
      <form id="contact-form">
        <input type="hidden" id="contact-id">

        <div class="form-group">
          <label>Prénom / Nom *</label>
          <input type="text" id="contact-name" required>
        </div>

        <div class="form-group">
          <label>Relation</label>
          <select id="contact-relation">
            <option value="Mère">Mère</option>
            <option value="Père">Père</option>
            <option value="Frère">Frère</option>
            <option value="Sœur">Sœur</option>
            <option value="Ami(e) proche">Ami(e) proche</option>
            <option value="Meilleur(e) ami(e)">Meilleur(e) ami(e)</option>
            <option value="Collègue">Collègue</option>
            <option value="Patron">Patron</option>
            <option value="Médecin">Médecin</option>
            <option value="Avocat">Avocat</option>
            <option value="Famille éloignée">Famille éloignée</option>
            <option value="Voisin">Voisin</option>
            <option value="Autre">Autre</option>
          </select>
          <input type="text" id="contact-relation-other" class="hidden" placeholder="Précisez...">
        </div>

        <div class="form-group">
          <label>Niveau d'importance (1 = Priorité absolue, 5 = Moins urgent)</label>
          <div class="importance-rating">
            <label class="radio-option"><input type="radio" name="importance" value="1" required> 1</label>
            <label class="radio-option"><input type="radio" name="importance" value="2"> 2</label>
            <label class="radio-option"><input type="radio" name="importance" value="3"> 3</label>
            <label class="radio-option"><input type="radio" name="importance" value="4"> 4</label>
            <label class="radio-option"><input type="radio" name="importance" value="5" checked> 5</label>
          </div>
        </div>

        <div class="form-group">
          <label>Téléphone</label>
          <input type="tel" id="contact-phone">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="contact-email">
        </div>

        <div class="form-group">
          <label>WhatsApp (Numéro international)</label>
          <input type="tel" id="contact-whatsapp">
        </div>

        <div class="form-group">
          <label>Snapchat (@)</label>
          <input type="text" id="contact-snap">
        </div>

        <div class="form-group">
          <label>Instagram (@)</label>
          <input type="text" id="contact-insta">
        </div>

        <div class="form-group">
          <label>Messenger (Nom d'utilisateur)</label>
          <input type="text" id="contact-messenger">
        </div>

        <div class="form-group">
          <label>Telegram (@)</label>
          <input type="text" id="contact-telegram">
        </div>

        <div class="form-group">
          <label>TikTok (@)</label>
          <input type="text" id="contact-tiktok">
        </div>

        <div class="form-group">
          <label>LinkedIn (@)</label>
          <input type="text" id="contact-linkedin">
        </div>

        <div class="form-group">
          <label>Twitter/X (@)</label>
          <input type="text" id="contact-twitter">
        </div>

        <div class="form-group">
          <label>Site web (URL)</label>
          <input type="url" id="contact-website">
        </div>

        <div class="form-group">
          <label>Adresse (Texte libre)</label>
          <input type="text" id="contact-address">
        </div>

        <div class="form-group">
          <label>Note personnelle</label>
          <textarea id="contact-notes" rows="4"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" id="btn-save-contact">Enregistrer</button>
      </form>
    </div>
  </div>

  </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
