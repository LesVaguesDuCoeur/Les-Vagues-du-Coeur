<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Coffre-Fort</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="flex items-center p-4 border-b justify-between">
<div class="flex gap-4" id="admin-tabs">
<button class="tab-btn active p-2" data-target="contacts-tab">Contacts</button>
<button class="tab-btn p-2" data-target="vault-tab">Vault</button>
<button class="tab-btn p-2" data-target="testament-tab">Testament</button>
<button class="tab-btn p-2" data-target="settings-tab">Paramètres</button>
</div>
<button id="logout-btn" class="p-2 border rounded" style="background:var(--danger);color:var(--text);border:none;">Déconnexion</button>
</nav>

<main class="p-4 flex flex-col items-center">
<div id="contacts-tab" class="tab-content active w-full" style="max-width:800px;">
<div class="flex justify-between items-center mb-4">
<h2>Contacts d'Urgence</h2>
<button id="add-contact-btn" class="p-2 rounded text-sm" style="background:var(--success);color:var(--text);border:none;"><i class="fas fa-plus"></i> Nouveau Contact</button>
</div>
<div id="contacts-list" class="flex flex-col"></div>
</div>

<div id="vault-tab" class="tab-content hidden w-full flex flex-col md:flex-row gap-4" style="max-width:1000px;">
<aside class="sidebar flex flex-col gap-2 w-full md:w-64">
<button class="vault-cat-btn active text-left p-2 rounded" data-cat="etat_civil"><i class="fas fa-user w-6"></i> État civil / Mon identité</button>
<button class="vault-cat-btn text-left p-2 rounded" data-cat="identifiants"><i class="fas fa-key w-6"></i> Identifiants & MDP</button>
<button class="vault-cat-btn text-left p-2 rounded" data-cat="cartes_bancaires"><i class="fas fa-credit-card w-6"></i> Cartes bancaires</button>
<button class="vault-cat-btn text-left p-2 rounded" data-cat="documents"><i class="fas fa-id-card w-6"></i> Documents</button>
<button class="vault-cat-btn text-left p-2 rounded" data-cat="comptes_bancaires"><i class="fas fa-university w-6"></i> Comptes bancaires</button>
<button class="vault-cat-btn text-left p-2 rounded" data-cat="codes_pin"><i class="fas fa-lock w-6"></i> Codes & PIN</button>
<button class="vault-cat-btn text-left p-2 rounded" data-cat="infos_medicales"><i class="fas fa-heartbeat w-6"></i> Infos médicales</button>
<button class="vault-cat-btn text-left p-2 rounded" data-cat="assurances"><i class="fas fa-shield-alt w-6"></i> Assurances</button>
<button class="vault-cat-btn text-left p-2 rounded" data-cat="licences"><i class="fas fa-barcode w-6"></i> Licences</button>
<button class="vault-cat-btn text-left p-2 rounded" data-cat="notes"><i class="fas fa-sticky-note w-6"></i> Notes libres</button>
</aside>
<div class="vault-content flex-1 p-4 rounded" style="background:var(--bg-element);">
<div class="flex justify-between items-center mb-4">
<h3 id="current-vault-cat">Catégorie</h3>
<button id="add-vault-item-btn" class="p-2 rounded text-sm" style="background:var(--success);color:var(--text);border:none;"><i class="fas fa-plus"></i> Ajouter</button>
</div>
<div id="vault-items-list" class="flex flex-col gap-2"></div>
</div>
</div>

<div id="testament-tab" class="tab-content hidden w-full" style="max-width:800px;">
<div class="flex justify-between items-center mb-4">
<h2>Testament & Volontés</h2>
<div class="flex gap-2">
<button id="save-testament-btn" class="p-2 rounded text-sm" style="background:var(--success);color:var(--text);border:none;"><i class="fas fa-save"></i> Sauvegarder</button>
<button id="pdf-testament-btn" class="p-2 rounded text-sm" style="background:var(--accent);color:var(--text);border:none;"><i class="fas fa-file-pdf"></i> PDF</button>
</div>
</div>
<div class="mb-4">
<h3>État Civil</h3>
<div class="flex flex-col gap-2 mt-2">
<input type="text" id="t-nom" placeholder="Nom de famille" class="p-2 rounded border" style="background:var(--bg);color:var(--text);border-color:var(--border);">
<input type="text" id="t-prenom" placeholder="Prénoms" class="p-2 rounded border" style="background:var(--bg);color:var(--text);border-color:var(--border);">
<input type="text" id="t-naissance" placeholder="Date de naissance" class="p-2 rounded border" style="background:var(--bg);color:var(--text);border-color:var(--border);">
<input type="text" id="t-lieu" placeholder="Lieu de naissance" class="p-2 rounded border" style="background:var(--bg);color:var(--text);border-color:var(--border);">
<input type="text" id="t-nationalite" placeholder="Nationalité" class="p-2 rounded border" style="background:var(--bg);color:var(--text);border-color:var(--border);">
<input type="text" id="t-adresse" placeholder="Adresse" class="p-2 rounded border" style="background:var(--bg);color:var(--text);border-color:var(--border);">
</div>
</div>
<div>
<h3>Dernières Volontés</h3>
<div id="quill-editor" style="height: 300px; background: white; color: black; border-radius: 4px; margin-top: 8px;"></div>
</div>
</div>

<div id="settings-tab" class="tab-content hidden w-full" style="max-width:800px;">
<h2>Paramètres</h2>
<div class="mt-4 flex flex-col gap-4">
<div class="p-4 rounded border flex flex-col gap-2" style="background:var(--bg-element);border-color:var(--border);">
<h3>Message d'urgence</h3>
<textarea id="emergency-message-input" rows="4" class="p-2 rounded border w-full" style="background:var(--bg);color:var(--text);border-color:var(--border);"></textarea>
<button id="save-emergency-message-btn" class="p-2 rounded text-sm w-32" style="background:var(--success);color:var(--text);border:none;">Sauvegarder</button>
</div>
<div class="p-4 rounded border flex flex-col gap-2" style="background:var(--bg-element);border-color:var(--border);">
<h3>Mots de passe</h3>
<button id="change-passwords-btn" class="p-2 rounded text-sm w-48" style="background:var(--warning);color:#000;border:none;">Changer les mots de passe</button>
</div>
<div class="p-4 rounded border flex flex-col gap-2" style="background:var(--bg-element);border-color:var(--border);">
<h3>Historique des accès</h3>
<div id="access-logs-list" class="flex flex-col gap-2 text-sm mt-2 max-h-64 overflow-y-auto"></div>
</div>
</div>
</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/crypto.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
