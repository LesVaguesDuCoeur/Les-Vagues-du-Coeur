<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - SecurApp</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <h1>SecurApp</h1>
        <p class="text-center mb-2">Accès Sécurisé</p>

        <form id="login-form">
            <div class="form-group">
                <input type="password" id="password" placeholder="Mot de passe" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary">Accéder</button>
        </form>

        <div id="setup-link" class="text-center mt-1 hidden">
            <a href="setup.html" style="color: var(--accent-main); text-decoration: none; font-size: 0.9rem;">Initialiser l'application</a>
        </div>
    </div>

    <!-- Modal Form for Emergency Access (Vault/Testament) -->
    <div id="emergency-modal" class="modal-overlay hidden" style="opacity: 1; animation: none;">
        <div class="modal-content" style="transform: none; animation: none;">
            <h2 class="modal-title">Accès d'urgence</h2>
            <div class="modal-body">
                Veuillez vous identifier pour accéder à cette section. Une alerte sera envoyée au propriétaire.
            </div>

            <form id="emergency-form">
                <div class="form-group">
                    <label for="emergency-name">Nom complet ou Nom de la société</label>
                    <input type="text" id="emergency-name" required>
                </div>
                <div class="form-group">
                    <label for="emergency-contact-pwd">Mot de passe CONTACT</label>
                    <input type="password" id="emergency-contact-pwd" required>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="btn-cancel-emergency">Annuler</button>
                    <button type="submit" class="btn btn-primary">Valider l'accès</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/crypto.js"></script>
    <script src="js/api.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
