<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body class="flex items-center justify-center">
<div class="w-64">
<div id="loader" class="text-center mb-4 hidden">
<i class="fas fa-spinner fa-spin text-xl"></i>
</div>
<form id="loginForm" class="flex-col gap-4">
<input type="password" id="password" placeholder="Mot de passe" required autocomplete="current-password" class="mb-4 text-center">
<button type="submit" class="btn btn-primary w-full" id="loginBtn">Accéder</button>
</form>
<div id="lockoutMsg" class="text-danger text-center mt-4 hidden"></div>
</div>
<div id="modalContainer"></div>
<script src="js/utils.js"></script>
<script src="js/crypto.js"></script>
<script src="js/api.js"></script>
<script src="js/index.js"></script>
</body>
</html>
