<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts d'Urgence Chiffres</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Contacts d'Urgence</h1>

        <div class="card login-box" id="login-container">
            <h2>Authentification</h2>
            <p>Veuillez entrer le mot de passe de la section a laquelle vous souhaitez acceder.</p>

            <form id="login-form">
                <div class="form-group">
                    <input type="password" id="password" placeholder="Mot de passe" required autocomplete="current-password">
                </div>
                <button type="submit">Acceder</button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/crypto.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
