<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffre-Fort</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
</head>
<body class="flex items-center justify-center min-h-screen">
<div class="login-box flex-col items-center justify-center">
<div id="login-form" class="flex flex-col gap-4 w-64 items-center">
<input type="password" id="password-input" class="w-full p-4 text-center rounded border" style="background:var(--bg-element);color:var(--text);border-color:var(--border);" autocomplete="off">
<button id="login-btn" class="w-full p-4 rounded text-center text-xl" style="background:var(--accent);color:var(--text);border:none;cursor:pointer;">
<i class="fas fa-arrow-right"></i>
</button>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/crypto.js"></script>
<script src="js/index.js"></script>
</body>
</html>
