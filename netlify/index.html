<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accès Sécurisé</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
<script src="js/utils.js"></script>
</head>
<body class="dark-theme">
  <div class="container center-screen fade-in">
    <div class="login-box">
      <input type="password" id="access-code" placeholder="Code d'accès" autocomplete="off" autofocus>
      <button id="btn-login" class="btn btn-primary"><i class="fas fa-lock"></i></button>
      <div id="error-message" class="error-msg hidden">Code incorrect</div>
      <div id="loader" class="loader hidden"></div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/index.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
