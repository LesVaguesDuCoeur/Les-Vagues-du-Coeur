<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Utilitaire</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="manifest" href="manifest.json">
</head>
<body>
<div class="login-wrapper card">
<div class="login-logo"><i class="fas fa-lock"></i></div>
<h2>Accès Sécurisé</h2>
<form id="login-form" style="margin-top:24px;">
<div class="input-group">
<div class="password-wrapper">
<input type="password" id="pwd" placeholder="Saisissez votre code" required autocomplete="off">
<button type="button" class="password-toggle" id="toggle-pwd"><i class="fas fa-eye"></i></button>
</div>
</div>
<button type="submit" class="btn btn-primary btn-block">Valider</button>
<div id="error-msg"></div>
</form>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script src="js/api.js"></script>
<script src="js/crypto.js"></script>
<script src="js/utils.js"></script>
<script src="js/index.js"></script>
</body>
</html>
