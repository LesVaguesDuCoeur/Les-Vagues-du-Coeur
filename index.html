<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Utilitaire</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh">
<div class="card" style="width:100%;max-width:400px;text-align:center">
<i class="fas fa-lock" style="font-size:3rem;color:#457b9d;margin-bottom:16px"></i>
<h1 style="margin-bottom:24px;font-size:1.5rem">Utilitaire</h1>
<div id="errorBox" style="display:none;background:#e63946;color:#fff;padding:12px;border-radius:8px;margin-bottom:16px;font-size:0.9rem"></div>
<div id="lockBox" style="display:none;background:#fca311;color:#000;padding:12px;border-radius:8px;margin-bottom:16px;font-weight:600"></div>
<form id="loginForm">
<div class="input-group">
<input type="password" id="loginInput" placeholder="Code d'accès" autocomplete="current-password" style="margin-bottom:0">
<button type="button" class="toggle-btn" aria-label="Afficher" onclick="toggleVisibility(this,'loginInput')"><i class="fas fa-eye"></i></button>
</div>
<button type="submit" class="btn-primary" style="width:100%;margin-top:16px" id="loginBtn">Valider</button>
</form>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/crypto.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/index.js"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
