<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PDF Studio</title>
  <meta name="description" content="Éditeur PDF web complet, 100% fonctionnel et sécurisé hors ligne.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <meta name="theme-color" content="#0a0a0f">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="loader-overlay" class="loader-overlay hidden" aria-hidden="true">
    <div class="loader-content">
      <div class="spinner"></div>
      <div id="loader-text" class="loader-text"></div>
      <div class="progress-bar-container">
        <div id="loader-progress" class="progress-bar"></div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <header class="app-header">
    <div class="header-brand">
      <img src="assets/logo.svg" alt="Logo PDF Studio" class="logo">
      <h1>PDF Studio</h1>
    </div>

    <div id="main-toolbar" class="toolbar hidden">
      <div class="toolbar-group" aria-label="Fichier">
        <button id="btn-open" class="btn icon-btn" aria-label="Ouvrir"><i class="fa-solid fa-folder-open"></i></button>
        <button id="btn-merge" class="btn icon-btn" aria-label="Fusionner"><i class="fa-solid fa-object-group"></i></button>
        <button id="btn-split" class="btn icon-btn" aria-label="Diviser"><i class="fa-solid fa-object-ungroup"></i></button>
      </div>

      <div class="toolbar-divider"></div>

      <div class="toolbar-group" aria-label="Édition">
        <button id="btn-select" class="btn icon-btn active" aria-label="Sélection"><i class="fa-solid fa-arrow-pointer"></i></button>
        <button id="btn-text" class="btn icon-btn" aria-label="Texte"><i class="fa-solid fa-font"></i></button>
        <button id="btn-erase" class="btn icon-btn" aria-label="Effacer"><i class="fa-solid fa-eraser"></i></button>
        <button id="btn-rect" class="btn icon-btn" aria-label="Rectangle blanc"><i class="fa-regular fa-square"></i></button>
        <button id="btn-highlight" class="btn icon-btn" aria-label="Surligner"><i class="fa-solid fa-highlighter"></i></button>
        <button id="btn-annotate" class="btn icon-btn" aria-label="Annoter"><i class="fa-solid fa-pen"></i></button>
      </div>

      <div class="toolbar-divider"></div>

      <div class="toolbar-group" aria-label="Pages">
        <button id="btn-rotate" class="btn icon-btn" aria-label="Pivoter"><i class="fa-solid fa-rotate-right"></i></button>
        <button id="btn-delete" class="btn icon-btn" aria-label="Supprimer"><i class="fa-solid fa-trash"></i></button>
        <button id="btn-duplicate" class="btn icon-btn" aria-label="Dupliquer"><i class="fa-solid fa-copy"></i></button>
        <button id="btn-insert" class="btn icon-btn" aria-label="Insérer page"><i class="fa-solid fa-file-circle-plus"></i></button>
      </div>

      <div class="toolbar-divider"></div>

      <div class="toolbar-group" aria-label="Outils">
        <button id="btn-watermark" class="btn icon-btn" aria-label="Filigrane"><i class="fa-solid fa-stamp"></i></button>
        <button id="btn-signature" class="btn icon-btn" aria-label="Signature"><i class="fa-solid fa-signature"></i></button>
        <button id="btn-compress" class="btn icon-btn" aria-label="Compresser"><i class="fa-solid fa-compress"></i></button>
        <button id="btn-ocr" class="btn icon-btn" aria-label="OCR"><i class="fa-solid fa-language"></i></button>
      </div>

      <div class="toolbar-divider"></div>

      <div class="toolbar-group" aria-label="Export">
        <button id="btn-download" class="btn icon-btn primary" aria-label="Télécharger"><i class="fa-solid fa-download"></i></button>
        <button id="btn-download-zip" class="btn icon-btn secondary" aria-label="Télécharger compressé"><i class="fa-solid fa-file-zipper"></i></button>
        <button id="btn-print" class="btn icon-btn" aria-label="Imprimer"><i class="fa-solid fa-print"></i></button>
      </div>
    </div>

    <div class="header-actions">
      <button id="btn-theme-toggle" class="btn icon-btn ghost" aria-label="Thème"><i class="fa-solid fa-moon"></i></button>
      <button id="btn-shortcuts" class="btn icon-btn ghost" aria-label="Raccourcis"><i class="fa-solid fa-keyboard"></i></button>
    </div>
  </header>

  <main class="app-main">
    <div id="welcome-screen" class="welcome-screen">
      <div class="drop-zone" id="main-drop-zone">
        <i class="fa-solid fa-file-pdf drop-icon"></i>
        <h2>Déposez vos fichiers ici</h2>
        <p>Support : PDF, DOCX, XLSX, PPTX, Images, TXT...</p>
        <button id="btn-browse" class="btn primary large">Parcourir</button>
        <input type="file" id="file-input" multiple class="hidden-input" accept=".pdf,.docx,.doc,.odt,.rtf,.txt,.md,.xlsx,.xls,.csv,.pptx,.ppt,.jpg,.jpeg,.png,.webp,.gif,.bmp,.tiff,.heic">
      </div>
      <div class="privacy-notice">
        <i class="fa-solid fa-shield-halved"></i>
        <span>Vos fichiers ne quittent jamais votre appareil. Tout est traité localement.</span>
      </div>
    </div>

    <div id="editor-layout" class="editor-layout hidden">
      <aside id="sidebar-left" class="sidebar sidebar-left">
        <div class="sidebar-header">
          <h3>Pages</h3>
          <div class="sidebar-actions">
            <button id="btn-select-all" class="btn icon-btn small ghost" aria-label="Tout sélectionner"><i class="fa-solid fa-check-double"></i></button>
          </div>
        </div>
        <div id="thumbnails-container" class="thumbnails-container"></div>
      </aside>

      <section id="workspace" class="workspace">
        <div class="workspace-toolbar">
          <div class="zoom-controls">
            <button id="btn-zoom-out" class="btn icon-btn small ghost" aria-label="Zoom arrière"><i class="fa-solid fa-minus"></i></button>
            <span id="zoom-level">100%</span>
            <button id="btn-zoom-in" class="btn icon-btn small ghost" aria-label="Zoom avant"><i class="fa-solid fa-plus"></i></button>
            <button id="btn-fit-width" class="btn icon-btn small ghost" aria-label="Ajuster largeur"><i class="fa-solid fa-arrows-left-right"></i></button>
            <button id="btn-fit-page" class="btn icon-btn small ghost" aria-label="Page entière"><i class="fa-solid fa-expand"></i></button>
          </div>
          <div class="page-navigation">
            <button id="btn-prev-page" class="btn icon-btn small ghost" aria-label="Page précédente"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="page-indicator">
              <input type="number" id="current-page-input" value="1" min="1" aria-label="Page courante">
              <span>/</span>
              <span id="total-pages-display">1</span>
            </div>
            <button id="btn-next-page" class="btn icon-btn small ghost" aria-label="Page suivante"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
        </div>

        <div id="canvas-container" class="canvas-container">
          <canvas id="pdf-canvas"></canvas>
          <div id="overlay-layer" class="overlay-layer"></div>
        </div>
      </section>

      <aside id="sidebar-right" class="sidebar sidebar-right hidden">
        <div class="sidebar-header">
          <h3 id="context-tool-title">Outil</h3>
          <button id="btn-close-sidebar-right" class="btn icon-btn small ghost" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="context-tool-content" class="context-tool-content"></div>
      </aside>
    </div>
  </main>

  <nav id="mobile-tab-bar" class="mobile-tab-bar hidden">
    <button id="tab-pages" class="tab-btn" aria-label="Pages"><i class="fa-solid fa-file-lines"></i><span>Pages</span></button>
    <button id="tab-tools" class="tab-btn" aria-label="Outils"><i class="fa-solid fa-toolbox"></i><span>Outils</span></button>
    <button id="tab-watermark" class="tab-btn" aria-label="Filigrane"><i class="fa-solid fa-stamp"></i><span>Filigrane</span></button>
    <button id="tab-signature" class="tab-btn" aria-label="Signature"><i class="fa-solid fa-signature"></i><span>Signature</span></button>
    <button id="tab-more" class="tab-btn" aria-label="Plus"><i class="fa-solid fa-ellipsis"></i><span>Plus</span></button>
  </nav>

  <div id="modal-container" class="modal-container hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Titre Modale</h2>
        <button id="btn-modal-close" class="btn icon-btn ghost" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <iframe id="print-iframe" style="display:none;" title="Impression"></iframe>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib-fontkit/1.1.1/fontkit.umd.min.js" defer></script>
  <script type="module">
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.min.mjs";
    window.pdfjsLib = pdfjsLib;
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.20.3/xlsx.full.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/signature_pad/5.0.4/signature_pad.umd.min.js" defer></script>

  <script type="module" src="js/utils.js"></script>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/fonts.js"></script>
  <script type="module" src="js/pdf-engine.js"></script>
  <script type="module" src="js/converter.js"></script>
  <script type="module" src="js/watermark.js"></script>
  <script type="module" src="js/signature.js"></script>
  <script type="module" src="js/editor.js"></script>
  <script type="module" src="js/compressor.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/sw-register.js"></script>
</body>
</html>
