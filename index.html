<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utilitaire</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="centered-body">
<div class="login-container">
<div class="login-header">
<i class="fas fa-lock login-logo"></i>
<h1>Utilitaire</h1>
</div>
<div id="error-message" class="error-box hidden"></div>
<div id="lockout-message" class="error-box hidden"></div>
<form id="login-form">
<div class="input-group">
<input type="password" id="password" placeholder="Mot de passe" required>
<button type="button" class="toggle-password" onclick="toggleVisibility(this, 'password')">
<i class="fas fa-eye"></i>
</button>
</div>
<button type="submit" class="btn-primary" id="btn-login">Valider</button>
</form>
<div id="loading-spinner" class="hidden">
<i class="fas fa-spinner fa-spin"></i> Chargement...
</div>
</div>
<div id="double-auth-modal" class="modal-overlay hidden">
<div class="modal-dialog">
<h2>Vérification de sécurité</h2>
<p>Veuillez confirmer votre identité pour accéder à cette section.</p>
<form id="double-auth-form">
<div class="input-group">
<input type="text" id="auth-name" placeholder="Nom complet" required>
</div>
<div class="input-group">
<input type="password" id="auth-code" placeholder="Code Urgence" required>
<button type="button" class="toggle-password" onclick="toggleVisibility(this, 'auth-code')">
<i class="fas fa-eye"></i>
</button>
</div>
<div class="modal-actions">
<button type="button" class="btn-secondary" onclick="closeDoubleAuth()">Annuler</button>
<button type="submit" class="btn-primary" id="btn-double-auth">Confirmer</button>
</div>
</form>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script src="js/api.js"></script>
<script src="js/crypto.js"></script>
<script src="js/utils.js"></script>
<script src="js/index.js"></script>
<script>
if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('/sw.js');
}
</script>
</body>
</html>
