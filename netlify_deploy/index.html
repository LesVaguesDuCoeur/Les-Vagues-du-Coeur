<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Vagues du Cœur - GastroPlan</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#10B981',
                        'primary-dark': '#059669',
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-20 md:pb-0">

    <!-- Header (Mobile Top) -->
    <header class="bg-white shadow-sm sticky top-0 z-30">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="bg-primary/10 p-2 rounded-full">
                    <i data-lucide="heart-pulse" class="text-primary w-6 h-6"></i>
                </div>
                <h1 class="text-lg font-bold text-gray-800 leading-tight">
                    Les Vagues du Cœur
                    <span class="block text-xs text-gray-500 font-normal">Alimentation Gastrite & Perte de poids</span>
                </h1>
            </div>
            <button id="sync-btn" class="text-gray-400 hover:text-primary transition-colors">
                <i data-lucide="refresh-cw" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto p-4 min-h-screen">

        <!-- VIEW: HOME -->
        <div id="view-home" class="view-section">
            <!-- Dynamic Content Injected via JS -->
        </div>

        <!-- VIEW: MENU -->
        <div id="view-menu" class="view-section hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Menu de la Semaine</h2>
                <button onclick="app.resetMenu()" class="text-xs text-red-500 hover:underline">Réinitialiser</button>
            </div>
            <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-gray-50 text-gray-600 border-b">
                            <tr>
                                <th class="px-4 py-3 font-medium">Jours</th>
                                <th class="px-4 py-3 font-medium min-w-[120px]">Matin</th>
                                <th class="px-4 py-3 font-medium min-w-[100px]">Collation</th>
                                <th class="px-4 py-3 font-medium min-w-[120px]">Midi</th>
                                <th class="px-4 py-3 font-medium min-w-[100px]">Goûter</th>
                                <th class="px-4 py-3 font-medium min-w-[120px]">Soir</th>
                            </tr>
                        </thead>
                        <tbody id="menu-grid-body" class="divide-y divide-gray-100">
                            <!-- JS Generated -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- VIEW: RECIPES -->
        <div id="view-recipes" class="view-section hidden">
            <div class="sticky top-[60px] bg-gray-50 pt-2 pb-4 z-20">
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-3 text-gray-400 w-5 h-5"></i>
                    <input type="text" id="recipe-search" placeholder="Chercher une recette, un ingrédient..."
                        class="w-full pl-10 pr-4 py-2 rounded-full border border-gray-200 focus:border-primary focus:ring-1 focus:ring-primary outline-none shadow-sm">
                </div>
                <div class="flex gap-2 mt-3 overflow-x-auto pb-1 hide-scrollbar" id="recipe-filters">
                    <button class="filter-chip active px-4 py-1.5 rounded-full bg-primary text-white text-sm font-medium whitespace-nowrap" data-filter="all">Tout</button>
                    <button class="filter-chip px-4 py-1.5 rounded-full bg-white border border-gray-200 text-gray-600 text-sm font-medium whitespace-nowrap" data-filter="plat_complet">Plats Complets</button>
                    <button class="filter-chip px-4 py-1.5 rounded-full bg-white border border-gray-200 text-gray-600 text-sm font-medium whitespace-nowrap" data-filter="petit_dejeuner">Petit-Déj</button>
                    <button class="filter-chip px-4 py-1.5 rounded-full bg-white border border-gray-200 text-gray-600 text-sm font-medium whitespace-nowrap" data-filter="collation">Collations</button>
                    <button class="filter-chip px-4 py-1.5 rounded-full bg-white border border-gray-200 text-gray-600 text-sm font-medium whitespace-nowrap" data-filter="favoris">❤️ Favoris</button>
                </div>
            </div>

            <div id="recipes-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4 pb-24">
                <!-- JS Generated -->
            </div>
        </div>

        <!-- VIEW: COURSES (SHOPPING LIST) -->
        <div id="view-shopping" class="view-section hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Liste de Courses</h2>
                <button onclick="app.copyShoppingList()" class="text-primary bg-primary/10 px-3 py-1 rounded-lg text-sm font-medium flex items-center gap-1">
                    <i data-lucide="copy" class="w-4 h-4"></i> Copier
                </button>
            </div>
            <div id="shopping-list-container" class="space-y-6 pb-24">
                <!-- JS Generated -->
            </div>
        </div>

        <!-- VIEW: FORBIDDEN -->
        <div id="view-forbidden" class="view-section hidden">
            <div class="sticky top-[60px] bg-gray-50 pt-2 pb-4 z-20">
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-3 text-gray-400 w-5 h-5"></i>
                    <input type="text" id="forbidden-search" placeholder="Rechercher un aliment..."
                        class="w-full pl-10 pr-4 py-2 rounded-full border border-gray-200 focus:border-red-400 focus:ring-1 focus:ring-red-400 outline-none shadow-sm">
                </div>
            </div>

            <div class="bg-red-50 border border-red-100 rounded-xl p-4 mb-6">
                <div class="flex items-start gap-3">
                    <i data-lucide="alert-triangle" class="text-red-500 w-6 h-6 mt-0.5"></i>
                    <div>
                        <h3 class="font-bold text-red-700">Attention Gastrite</h3>
                        <p class="text-sm text-red-600 mt-1">Ces aliments irritent la muqueuse. À éviter.</p>
                    </div>
                </div>
            </div>
            <div id="forbidden-list" class="space-y-4 pb-24">
                <!-- JS Generated -->
            </div>
        </div>

    </main>

    <!-- Modal: Recipe Detail -->
    <div id="modal-recipe" class="fixed inset-0 z-50 flex items-end md:items-center justify-center modal-hidden">
        <div class="modal-overlay absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="app.closeModal()"></div>
        <div class="modal-content bg-white w-full md:w-[600px] md:rounded-2xl rounded-t-2xl shadow-2xl max-h-[90vh] overflow-y-auto relative">
            <button onclick="app.closeModal()" class="absolute top-4 right-4 bg-gray-100 p-2 rounded-full hover:bg-gray-200 z-10">
                <i data-lucide="x" class="w-5 h-5 text-gray-600"></i>
            </button>
            <div id="modal-body">
                <!-- JS Injected -->
            </div>
            <div class="sticky bottom-0 bg-white border-t p-4 flex gap-3">
                <button onclick="app.addToMenuFromModal()" class="flex-1 bg-primary hover:bg-primary-dark text-white font-medium py-3 rounded-xl shadow-lg shadow-primary/30 flex items-center justify-center gap-2">
                    <i data-lucide="calendar-plus" class="w-5 h-5"></i>
                    Ajouter au Menu
                </button>
            </div>
        </div>
    </div>

    <!-- Navigation (Mobile Bottom / Desktop Fixed) -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 md:w-[400px] md:left-1/2 md:-translate-x-1/2 md:bottom-4 md:rounded-full md:shadow-xl md:border z-40">
        <div class="grid grid-cols-5 h-16">
            <button class="nav-item active flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-primary transition-colors" onclick="app.navigateTo('home')">
                <i data-lucide="home" class="w-5 h-5 mb-1"></i>
                <span class="text-[10px] font-medium">Accueil</span>
            </button>
            <button class="nav-item flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-primary transition-colors" onclick="app.navigateTo('menu')">
                <i data-lucide="calendar" class="w-5 h-5 mb-1"></i>
                <span class="text-[10px] font-medium">Menu</span>
            </button>
            <button class="nav-item flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-primary transition-colors" onclick="app.navigateTo('recipes')">
                <i data-lucide="chef-hat" class="w-5 h-5 mb-1"></i>
                <span class="text-[10px] font-medium">Recettes</span>
            </button>
            <button class="nav-item flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-primary transition-colors" onclick="app.navigateTo('shopping')">
                <i data-lucide="shopping-cart" class="w-5 h-5 mb-1"></i>
                <span class="text-[10px] font-medium">Courses</span>
            </button>
            <button class="nav-item flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-primary transition-colors" onclick="app.navigateTo('forbidden')">
                <i data-lucide="ban" class="w-5 h-5 mb-1"></i>
                <span class="text-[10px] font-medium">Interdits</span>
            </button>
        </div>
    </nav>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
        // Init Lucide
        lucide.createIcons();
    </script>
</body>
</html>
