<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Vagues du Coeur - GastroPlan</title>
    <meta name="description" content="Application de planification de repas pour gastrite et perte de poids">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#10B981',
                        'primary-dark': '#059669',
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-20 md:pb-0">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-30">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="bg-primary/10 p-2 rounded-full">
                    <i data-lucide="heart-pulse" class="text-primary w-6 h-6"></i>
                </div>
                <h1 class="text-lg font-bold text-gray-800 leading-tight">
                    Les Vagues du Coeur
                    <span class="block text-xs text-gray-500 font-normal">Gastrite & Perte de poids</span>
                </h1>
            </div>
            <div class="flex items-center gap-2">
                <button id="print-btn" class="text-gray-400 hover:text-primary transition-colors p-2" title="Imprimer">
                    <i data-lucide="printer" class="w-5 h-5"></i>
                </button>
                <button id="sync-btn" class="text-gray-400 hover:text-primary transition-colors p-2" title="Synchroniser">
                    <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto p-4 min-h-screen">

        <!-- VIEW: HOME -->
        <div id="view-home" class="view-section">
            <!-- Dynamic Content Injected via JS -->
        </div>

        <!-- VIEW: MENU (Multi-week) -->
        <div id="view-menu" class="view-section hidden">
            <div class="flex flex-col gap-4 mb-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-bold">Planning des Repas</h2>
                    <div class="flex gap-2">
                        <button onclick="app.exportToIcal()" class="text-xs bg-blue-500 text-white px-3 py-1.5 rounded-lg hover:bg-blue-600 flex items-center gap-1">
                            <i data-lucide="calendar-check" class="w-3 h-3"></i>
                            iCal
                        </button>
                        <button onclick="app.resetMenu()" class="text-xs text-red-500 hover:underline">Reinitialiser</button>
                    </div>
                </div>

                <!-- Week Navigation -->
                <div class="flex items-center justify-between bg-white rounded-xl p-3 shadow-sm border border-gray-100">
                    <button onclick="app.changeWeek(-1)" class="p-2 hover:bg-gray-100 rounded-lg">
                        <i data-lucide="chevron-left" class="w-5 h-5"></i>
                    </button>
                    <div class="text-center">
                        <div id="current-week-label" class="font-bold text-gray-800">Semaine du 27 Jan</div>
                        <div id="current-week-dates" class="text-xs text-gray-500">27 Jan - 2 Fev 2025</div>
                    </div>
                    <button onclick="app.changeWeek(1)" class="p-2 hover:bg-gray-100 rounded-lg">
                        <i data-lucide="chevron-right" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- Week Selector Pills -->
                <div class="flex gap-2 overflow-x-auto pb-1 hide-scrollbar" id="week-pills">
                    <!-- Generated by JS -->
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-gray-50 text-gray-600 border-b">
                            <tr>
                                <th class="px-3 py-3 font-medium">Jour</th>
                                <th class="px-3 py-3 font-medium min-w-[100px]">Matin</th>
                                <th class="px-3 py-3 font-medium min-w-[80px]">10h</th>
                                <th class="px-3 py-3 font-medium min-w-[100px]">Midi</th>
                                <th class="px-3 py-3 font-medium min-w-[80px]">16h</th>
                                <th class="px-3 py-3 font-medium min-w-[100px]">Soir</th>
                            </tr>
                        </thead>
                        <tbody id="menu-grid-body" class="divide-y divide-gray-100">
                            <!-- JS Generated -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- VIEW: RECIPES -->
        <div id="view-recipes" class="view-section hidden">
            <div class="sticky top-[60px] bg-gray-50 pt-2 pb-4 z-20">
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-3 text-gray-400 w-5 h-5"></i>
                    <input type="text" id="recipe-search" placeholder="Chercher une recette, un ingredient..."
                        class="w-full pl-10 pr-4 py-2.5 rounded-full border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none shadow-sm">
                </div>
                <div class="flex gap-2 mt-3 overflow-x-auto pb-1 hide-scrollbar" id="recipe-filters">
                    <button class="filter-chip active px-4 py-1.5 rounded-full bg-primary text-white text-sm font-medium whitespace-nowrap" data-filter="all">Tout</button>
                    <button class="filter-chip px-4 py-1.5 rounded-full bg-white border border-gray-200 text-gray-600 text-sm font-medium whitespace-nowrap" data-filter="proteine">Proteines</button>
                    <button class="filter-chip px-4 py-1.5 rounded-full bg-white border border-gray-200 text-gray-600 text-sm font-medium whitespace-nowrap" data-filter="plat_complet">Plats</button>
                    <button class="filter-chip px-4 py-1.5 rounded-full bg-white border border-gray-200 text-gray-600 text-sm font-medium whitespace-nowrap" data-filter="legume">Legumes</button>
                    <button class="filter-chip px-4 py-1.5 rounded-full bg-white border border-gray-200 text-gray-600 text-sm font-medium whitespace-nowrap" data-filter="feculent">Feculents</button>
                    <button class="filter-chip px-4 py-1.5 rounded-full bg-white border border-gray-200 text-gray-600 text-sm font-medium whitespace-nowrap" data-filter="petit_dejeuner">Petit-Dej</button>
                    <button class="filter-chip px-4 py-1.5 rounded-full bg-white border border-gray-200 text-gray-600 text-sm font-medium whitespace-nowrap" data-filter="collation">Collations</button>
                </div>
            </div>

            <div id="recipes-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- JS Generated -->
            </div>
        </div>

        <!-- VIEW: FORBIDDEN (with search) -->
        <div id="view-forbidden" class="view-section hidden">
            <!-- Search Bar -->
            <div class="sticky top-[60px] bg-gray-50 pt-2 pb-4 z-20">
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-3 text-gray-400 w-5 h-5"></i>
                    <input type="text" id="forbidden-search" placeholder="Rechercher un ingredient interdit ou autorise..."
                        class="w-full pl-10 pr-4 py-2.5 rounded-full border border-gray-200 focus:border-red-400 focus:ring-2 focus:ring-red-100 outline-none shadow-sm">
                </div>
            </div>

            <!-- Search Results -->
            <div id="forbidden-search-results" class="hidden mb-4">
                <!-- JS Generated -->
            </div>

            <div class="bg-red-50 border border-red-100 rounded-xl p-4 mb-6">
                <div class="flex items-start gap-3">
                    <i data-lucide="alert-triangle" class="text-red-500 w-6 h-6 mt-0.5"></i>
                    <div>
                        <h3 class="font-bold text-red-700">Attention Gastrite</h3>
                        <p class="text-sm text-red-600 mt-1">Ces aliments irritent la muqueuse de l'estomac. A eviter absolument en phase de crise.</p>
                    </div>
                </div>
            </div>
            <div id="forbidden-list" class="space-y-4">
                <!-- JS Generated -->
            </div>
        </div>

        <!-- VIEW: SHOPPING LIST -->
        <div id="view-shopping" class="view-section hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Liste de Courses</h2>
                <div class="flex gap-2">
                    <button onclick="app.exportShoppingList()" class="text-xs bg-primary text-white px-3 py-1.5 rounded-lg hover:bg-primary-dark flex items-center gap-1">
                        <i data-lucide="download" class="w-3 h-3"></i>
                        Exporter
                    </button>
                    <button onclick="app.clearCheckedItems()" class="text-xs text-gray-500 hover:underline">Vider coches</button>
                </div>
            </div>

            <!-- Week selector for shopping -->
            <div class="bg-white rounded-xl p-3 shadow-sm border border-gray-100 mb-4">
                <label class="text-sm text-gray-600 block mb-2">Generer la liste pour:</label>
                <div class="flex gap-2 flex-wrap">
                    <button onclick="app.generateShoppingList(1)" class="px-3 py-1.5 rounded-lg bg-primary text-white text-sm">Cette semaine</button>
                    <button onclick="app.generateShoppingList(2)" class="px-3 py-1.5 rounded-lg bg-gray-100 text-gray-700 text-sm hover:bg-gray-200">2 semaines</button>
                    <button onclick="app.generateShoppingList(4)" class="px-3 py-1.5 rounded-lg bg-gray-100 text-gray-700 text-sm hover:bg-gray-200">1 mois</button>
                </div>
            </div>

            <div id="shopping-list-container" class="space-y-4">
                <!-- JS Generated -->
            </div>
        </div>

    </main>

    <!-- Modal: Recipe Detail -->
    <div id="modal-recipe" class="fixed inset-0 z-50 flex items-end md:items-center justify-center modal-hidden">
        <div class="modal-overlay absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="app.closeModal()"></div>
        <div class="modal-content bg-white w-full md:w-[600px] md:rounded-2xl rounded-t-2xl shadow-2xl max-h-[90vh] overflow-y-auto relative">
            <button onclick="app.closeModal()" class="absolute top-4 right-4 bg-white/90 p-2 rounded-full hover:bg-gray-100 z-10 shadow">
                <i data-lucide="x" class="w-5 h-5 text-gray-600"></i>
            </button>
            <div id="modal-body">
                <!-- JS Injected -->
            </div>
            <div class="sticky bottom-0 bg-white border-t p-4 flex gap-3">
                <button onclick="app.toggleFavorite()" id="fav-btn" class="p-3 border border-gray-200 rounded-xl hover:bg-gray-50">
                    <i data-lucide="heart" class="w-5 h-5 text-gray-400" id="fav-icon"></i>
                </button>
                <button onclick="app.addToMenuFromModal()" class="flex-1 bg-primary hover:bg-primary-dark text-white font-medium py-3 rounded-xl shadow-lg shadow-primary/30 flex items-center justify-center gap-2">
                    <i data-lucide="calendar-plus" class="w-5 h-5"></i>
                    Ajouter au Menu
                </button>
            </div>
        </div>
    </div>

    <!-- Modal: Day/Meal Selector -->
    <div id="modal-day-selector" class="fixed inset-0 z-50 flex items-end md:items-center justify-center modal-hidden">
        <div class="modal-overlay absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="app.closeDaySelector()"></div>
        <div class="modal-content bg-white w-full md:w-[400px] md:rounded-2xl rounded-t-2xl shadow-2xl max-h-[80vh] overflow-y-auto relative p-6">
            <h3 class="font-bold text-lg mb-4">Ajouter au menu</h3>
            <div class="space-y-3" id="day-selector-content">
                <!-- JS Generated -->
            </div>
            <button onclick="app.closeDaySelector()" class="w-full mt-4 py-2 text-gray-500 hover:text-gray-700">Annuler</button>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 md:w-[500px] md:left-1/2 md:-translate-x-1/2 md:bottom-4 md:rounded-full md:shadow-xl md:border z-40">
        <div class="flex justify-around items-center h-16">
            <button class="nav-item active flex flex-col items-center justify-center px-3 h-full text-gray-400 hover:text-primary transition-colors" onclick="app.navigateTo('home')" data-view="home">
                <i data-lucide="home" class="w-5 h-5 mb-0.5"></i>
                <span class="text-[10px] font-medium">Accueil</span>
            </button>
            <button class="nav-item flex flex-col items-center justify-center px-3 h-full text-gray-400 hover:text-primary transition-colors" onclick="app.navigateTo('menu')" data-view="menu">
                <i data-lucide="calendar" class="w-5 h-5 mb-0.5"></i>
                <span class="text-[10px] font-medium">Menu</span>
            </button>
            <button class="nav-item flex flex-col items-center justify-center px-3 h-full text-gray-400 hover:text-primary transition-colors" onclick="app.navigateTo('recipes')" data-view="recipes">
                <i data-lucide="chef-hat" class="w-5 h-5 mb-0.5"></i>
                <span class="text-[10px] font-medium">Recettes</span>
            </button>
            <button class="nav-item flex flex-col items-center justify-center px-3 h-full text-gray-400 hover:text-primary transition-colors" onclick="app.navigateTo('shopping')" data-view="shopping">
                <i data-lucide="shopping-cart" class="w-5 h-5 mb-0.5"></i>
                <span class="text-[10px] font-medium">Courses</span>
            </button>
            <button class="nav-item flex flex-col items-center justify-center px-3 h-full text-gray-400 hover:text-primary transition-colors" onclick="app.navigateTo('forbidden')" data-view="forbidden">
                <i data-lucide="ban" class="w-5 h-5 mb-0.5"></i>
                <span class="text-[10px] font-medium">Interdits</span>
            </button>
        </div>
    </nav>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
