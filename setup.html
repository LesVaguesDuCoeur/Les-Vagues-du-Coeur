<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utilitaire - Setup</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2 class="text-center mb-4">Initialisation</h2>
      <div id="setup-form">
        <div class="form-group">
          <label>Mot de passe Admin (min 8)</label>
          <input type="password" id="admin-pwd">
        </div>
        <div class="form-group">
          <label>Confirmer Admin</label>
          <input type="password" id="admin-pwd-confirm">
        </div>
        <hr style="border-color:#333; margin:20px 0;">
        <div class="form-group">
          <label>Mot de passe Urgence (min 6)</label>
          <input type="password" id="urg-pwd">
        </div>
        <div class="form-group">
          <label>Confirmer Urgence</label>
          <input type="password" id="urg-pwd-confirm">
        </div>
        <hr style="border-color:#333; margin:20px 0;">
        <div class="form-group">
          <label>Mot de passe Vault (min 6)</label>
          <input type="password" id="vault-pwd">
        </div>
        <div class="form-group">
          <label>Confirmer Vault</label>
          <input type="password" id="vault-pwd-confirm">
        </div>
        <hr style="border-color:#333; margin:20px 0;">
        <div class="form-group">
          <label>Mot de passe Testament (min 6)</label>
          <input type="password" id="test-pwd">
        </div>
        <div class="form-group">
          <label>Confirmer Testament</label>
          <input type="password" id="test-pwd-confirm">
        </div>
        <hr style="border-color:#333; margin:20px 0;">
        <div class="form-group">
          <label>Message d'urgence (optionnel)</label>
          <textarea id="urg-msg" rows="4"></textarea>
        </div>
        <button id="btn-setup" class="mt-4">Finaliser l'installation</button>
      </div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/setup.js"></script>
</body>
</html>
