<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuration — Utilitaire</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="loading" class="spinner-container" style="display:none;">
<div class="spinner"></div>
</div>
<div class="container py-32">
<div class="card">
<h1 class="mb-24"><i class="fas fa-cog text-accent"></i> Configuration initiale</h1>
<p class="text-secondary mb-24">Veuillez définir vos codes d'accès. Ils doivent tous être différents.</p>
<form id="setup-form">
<div class="setup-section mb-24">
<h3 class="mb-16"><i class="fas fa-user-shield"></i> Code Admin</h3>
<div class="input-group mb-8">
<input type="password" id="admin-pwd" placeholder="Code Admin (min. 8 caractères)" required minlength="8">
<button type="button" class="toggle-pwd" onclick="toggleVisibility(this, 'admin-pwd')"><i class="fas fa-eye"></i></button>
</div>
<div class="pwd-strength" id="admin-strength"></div>
<div class="input-group">
<input type="password" id="admin-pwd-conf" placeholder="Confirmer Code Admin" required minlength="8">
<button type="button" class="toggle-pwd" onclick="toggleVisibility(this, 'admin-pwd-conf')"><i class="fas fa-eye"></i></button>
</div>
</div>
<div class="setup-section mb-24">
<h3 class="mb-16"><i class="fas fa-exclamation-triangle"></i> Code Urgence</h3>
<div class="input-group mb-8">
<input type="password" id="emergency-pwd" placeholder="Code Urgence (min. 6 caractères)" required minlength="6">
<button type="button" class="toggle-pwd" onclick="toggleVisibility(this, 'emergency-pwd')"><i class="fas fa-eye"></i></button>
</div>
<div class="pwd-strength" id="emergency-strength"></div>
<div class="input-group">
<input type="password" id="emergency-pwd-conf" placeholder="Confirmer Code Urgence" required minlength="6">
<button type="button" class="toggle-pwd" onclick="toggleVisibility(this, 'emergency-pwd-conf')"><i class="fas fa-eye"></i></button>
</div>
</div>
<div class="setup-section mb-24">
<h3 class="mb-16"><i class="fas fa-shield-alt"></i> Code Vault</h3>
<div class="input-group mb-8">
<input type="password" id="vault-pwd" placeholder="Code Vault (min. 6 caractères)" required minlength="6">
<button type="button" class="toggle-pwd" onclick="toggleVisibility(this, 'vault-pwd')"><i class="fas fa-eye"></i></button>
</div>
<div class="pwd-strength" id="vault-strength"></div>
<div class="input-group">
<input type="password" id="vault-pwd-conf" placeholder="Confirmer Code Vault" required minlength="6">
<button type="button" class="toggle-pwd" onclick="toggleVisibility(this, 'vault-pwd-conf')"><i class="fas fa-eye"></i></button>
</div>
</div>
<div class="setup-section mb-24">
<h3 class="mb-16"><i class="fas fa-scroll"></i> Code Testament</h3>
<div class="input-group mb-8">
<input type="password" id="testament-pwd" placeholder="Code Testament (min. 6 caractères)" required minlength="6">
<button type="button" class="toggle-pwd" onclick="toggleVisibility(this, 'testament-pwd')"><i class="fas fa-eye"></i></button>
</div>
<div class="pwd-strength" id="testament-strength"></div>
<div class="input-group">
<input type="password" id="testament-pwd-conf" placeholder="Confirmer Code Testament" required minlength="6">
<button type="button" class="toggle-pwd" onclick="toggleVisibility(this, 'testament-pwd-conf')"><i class="fas fa-eye"></i></button>
</div>
</div>
<div class="setup-section mb-24">
<h3 class="mb-16"><i class="fas fa-comment-alt"></i> Message d'urgence (optionnel)</h3>
<textarea id="emergency-msg" placeholder="Message affiché en cas d'urgence..." rows="4"></textarea>
</div>
<button type="submit" class="btn-primary w-100">Configurer</button>
</form>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script src="js/crypto.js"></script>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/setup.js"></script>
</body>
</html>
