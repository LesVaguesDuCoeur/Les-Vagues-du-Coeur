<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utilitaire - Setup</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="card" style="max-width:600px;margin:0 auto;margin-top:50px;">
      <h2 style="text-align:center;margin-bottom:30px;"><i class="fas fa-cogs"></i> Configuration Initiale</h2>
      <p style="margin-bottom:20px;color:#ccc;text-align:center;">Veuillez définir les 4 codes d'accès. Ils doivent tous être différents.</p>
      <form id="s-f">
        <div class="vault-field">
          <label class="vault-field-label">Code Admin (min. 8 caractères)</label>
          <div style="position:relative;">
            <input type="password" id="p1" required minlength="8">
            <button type="button" class="icon-btn" style="position:absolute;right:10px;top:10px;" id="t1"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div class="vault-field">
          <label class="vault-field-label">Confirmer Code Admin</label>
          <div style="position:relative;">
            <input type="password" id="p1c" required minlength="8">
          </div>
        </div>
        <hr style="border:0;border-top:1px solid rgba(255,255,255,0.1);margin:20px 0;">
        <div class="vault-field">
          <label class="vault-field-label">Code Urgence (Contacts) (min. 6 caractères)</label>
          <div style="position:relative;">
            <input type="password" id="p2" required minlength="6">
            <button type="button" class="icon-btn" style="position:absolute;right:10px;top:10px;" id="t2"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div class="vault-field">
          <label class="vault-field-label">Confirmer Code Urgence</label>
          <div style="position:relative;">
            <input type="password" id="p2c" required minlength="6">
          </div>
        </div>
        <hr style="border:0;border-top:1px solid rgba(255,255,255,0.1);margin:20px 0;">
        <div class="vault-field">
          <label class="vault-field-label">Code Vault (min. 6 caractères)</label>
          <div style="position:relative;">
            <input type="password" id="p3" required minlength="6">
            <button type="button" class="icon-btn" style="position:absolute;right:10px;top:10px;" id="t3"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div class="vault-field">
          <label class="vault-field-label">Confirmer Code Vault</label>
          <div style="position:relative;">
            <input type="password" id="p3c" required minlength="6">
          </div>
        </div>
        <hr style="border:0;border-top:1px solid rgba(255,255,255,0.1);margin:20px 0;">
        <div class="vault-field">
          <label class="vault-field-label">Code Testament (min. 6 caractères)</label>
          <div style="position:relative;">
            <input type="password" id="p4" required minlength="6">
            <button type="button" class="icon-btn" style="position:absolute;right:10px;top:10px;" id="t4"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div class="vault-field">
          <label class="vault-field-label">Confirmer Code Testament</label>
          <div style="position:relative;">
            <input type="password" id="p4c" required minlength="6">
          </div>
        </div>
        <hr style="border:0;border-top:1px solid rgba(255,255,255,0.1);margin:20px 0;">
        <div class="vault-field">
          <label class="vault-field-label">Message d'Urgence (Optionnel - visible avec le code Urgence)</label>
          <textarea id="em" rows="4" placeholder="Instructions en cas d'urgence..."></textarea>
        </div>
        <button type="submit" id="s-b" style="width:100%;margin-top:20px;padding:15px;font-size:1.1rem;"><i class="fas fa-save"></i> Initialiser</button>
      </form>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/setup.js"></script>
</body>
</html>
