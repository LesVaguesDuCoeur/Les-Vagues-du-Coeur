<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Configuration - Utilitaire</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="manifest" href="manifest.json">
</head>
<body>
<div class="main-content" style="max-width:800px;margin:0 auto;">
<div class="card">
<h2><i class="fas fa-cog"></i> Configuration Initiale</h2>
<p style="color:var(--text-sec);margin-bottom:24px;">Définissez vos codes d'accès. Ils doivent tous être différents.</p>
<form id="setup-form">
<div class="input-group">
<label>Code Admin (≥8 caractères)</label>
<div class="password-wrapper">
<input type="password" id="admin-code" required minlength="8" autocomplete="new-password">
<button type="button" class="password-toggle" onclick="toggleVisibility('admin-code',this)"><i class="fas fa-eye"></i></button>
</div>
<div class="pwd-strength"><div class="pwd-strength-bar" id="admin-strength"></div></div>
</div>
<div class="input-group">
<label>Confirmer Admin</label>
<input type="password" id="admin-confirm" required minlength="8" autocomplete="new-password">
</div>
<hr style="border:0;border-top:1px solid var(--border);margin:24px 0;">
<div class="input-group">
<label>Code Urgence (≥6 caractères)</label>
<div class="password-wrapper">
<input type="password" id="em-code" required minlength="6" autocomplete="new-password">
<button type="button" class="password-toggle" onclick="toggleVisibility('em-code',this)"><i class="fas fa-eye"></i></button>
</div>
</div>
<div class="input-group">
<label>Confirmer Urgence</label>
<input type="password" id="em-confirm" required minlength="6" autocomplete="new-password">
</div>
<div class="input-group">
<label>Message d'urgence global (sera visible avec le code Urgence)</label>
<textarea id="em-msg" rows="4"></textarea>
</div>
<hr style="border:0;border-top:1px solid var(--border);margin:24px 0;">
<div class="input-group">
<label>Code Vault (≥6 caractères)</label>
<div class="password-wrapper">
<input type="password" id="vault-code" required minlength="6" autocomplete="new-password">
<button type="button" class="password-toggle" onclick="toggleVisibility('vault-code',this)"><i class="fas fa-eye"></i></button>
</div>
</div>
<div class="input-group">
<label>Confirmer Vault</label>
<input type="password" id="vault-confirm" required minlength="6" autocomplete="new-password">
</div>
<hr style="border:0;border-top:1px solid var(--border);margin:24px 0;">
<div class="input-group">
<label>Code Testament (≥6 caractères)</label>
<div class="password-wrapper">
<input type="password" id="test-code" required minlength="6" autocomplete="new-password">
<button type="button" class="password-toggle" onclick="toggleVisibility('test-code',this)"><i class="fas fa-eye"></i></button>
</div>
</div>
<div class="input-group">
<label>Confirmer Testament</label>
<input type="password" id="test-confirm" required minlength="6" autocomplete="new-password">
</div>
<button type="submit" class="btn btn-primary btn-block" style="margin-top:24px;" id="btn-save">Enregistrer la configuration</button>
</form>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script src="js/api.js"></script>
<script src="js/crypto.js"></script>
<script src="js/utils.js"></script>
<script src="js/setup.js"></script>
</body>
</html>
