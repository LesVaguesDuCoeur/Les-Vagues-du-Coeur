<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utilitaire</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
  <div class="layout-wrapper" id="app" style="display:none;">
    <aside class="sidebar">
      <h2 style="font-size:1.2rem;text-align:center;margin-bottom:30px;color:#457b9d;"><i class="fas fa-shield-alt"></i> Dashboard</h2>
      <a class="nav-item active" data-target="c-v"><i class="fas fa-address-book"></i> Contacts Urgence</a>
      <a class="nav-item" data-target="v-v"><i class="fas fa-lock"></i> Vault</a>
      <a class="nav-item" data-target="t-v"><i class="fas fa-scroll"></i> Testament</a>
      <a class="nav-item" data-target="s-v"><i class="fas fa-cog"></i> Paramètres</a>
      <a class="nav-item" id="logout" style="margin-top:20px;color:#e63946;"><i class="fas fa-sign-out-alt"></i> Déconnexion</a>
    </aside>
    <main class="main-content">
      <section id="c-v" class="view-section">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
          <h2>Contacts Urgence</h2>
          <button id="add-c"><i class="fas fa-plus"></i> Ajouter</button>
        </div>
        <div id="c-l"></div>
      </section>
      <section id="v-v" class="view-section hidden">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
          <h2>Vault Personnel</h2>
          <button id="add-v"><i class="fas fa-plus"></i> Ajouter</button>
        </div>
        <div class="vault-grid" id="v-l"></div>
      </section>
      <section id="t-v" class="view-section hidden">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
          <h2>Dernières Volontés</h2>
          <div>
            <button id="s-t" class="btn-success" style="margin-right:10px;"><i class="fas fa-save"></i> Sauvegarder</button>
            <button id="p-t"><i class="fas fa-file-pdf"></i> PDF</button>
          </div>
        </div>
        <div class="card">
          <h3 style="font-size:1rem;color:#457b9d;margin-bottom:15px;">Identité</h3>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;">
            <input type="text" id="ti-n" placeholder="Nom">
            <input type="text" id="ti-p" placeholder="Prénom">
            <input type="text" id="ti-dn" placeholder="Date de naissance (JJ/MM/AAAA)">
            <input type="text" id="ti-ln" placeholder="Lieu de naissance">
            <input type="text" id="ti-nat" placeholder="Nationalité">
            <input type="text" id="ti-a" placeholder="Adresse complète">
          </div>
        </div>
        <div id="editor"></div>
        <p id="t-s-i" style="text-align:right;color:#888;font-size:0.8rem;margin-top:10px;"></p>
      </section>
      <section id="s-v" class="view-section hidden">
        <h2>Paramètres</h2>
        <div class="card">
          <h3>Message d'Urgence</h3>
          <textarea id="set-em" rows="4"></textarea>
          <button id="s-em" class="btn-success"><i class="fas fa-save"></i> Enregistrer</button>
        </div>
        <div class="card">
          <h3>Modifier les codes d'accès</h3>
          <p style="color:#fca311;font-size:0.9rem;margin-bottom:15px;">Attention : la modification d'un code nécessite de rechiffrer toutes les données.</p>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;">
            <div>
              <label>Nouveau Code Admin (min. 8)</label>
              <input type="password" id="np-a">
            </div>
            <div>
              <label>Confirmer Code Admin</label>
              <input type="password" id="npc-a">
            </div>
            <div>
              <label>Nouveau Code Urgence (min. 6)</label>
              <input type="password" id="np-u">
            </div>
            <div>
              <label>Confirmer Code Urgence</label>
              <input type="password" id="npc-u">
            </div>
            <div>
              <label>Nouveau Code Vault (min. 6)</label>
              <input type="password" id="np-v">
            </div>
            <div>
              <label>Confirmer Code Vault</label>
              <input type="password" id="npc-v">
            </div>
            <div>
              <label>Nouveau Code Testament (min. 6)</label>
              <input type="password" id="np-t">
            </div>
            <div>
              <label>Confirmer Code Testament</label>
              <input type="password" id="npc-t">
            </div>
          </div>
          <button id="s-p" class="btn-danger" style="margin-top:15px;"><i class="fas fa-key"></i> Changer les codes</button>
        </div>
        <div class="card">
          <h3>Historique des accès</h3>
          <div id="l-l" style="max-height:300px;overflow-y:auto;background:#1a1a2e;padding:15px;border-radius:8px;"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="js/api.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
