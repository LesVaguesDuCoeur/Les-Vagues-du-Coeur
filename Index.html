<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <title>WhatsHappen</title>
  <?!= include('CSS'); ?>
</head>
<body>

<div id="app">
  <!-- Loading Overlay -->
  <div id="loading" class="hidden">
    <div class="spinner"></div>
    <div id="loading-text">Chargement...</div>
  </div>

  <!-- VIEW: LOGIN -->
  <div id="view-login" class="view active">
    <div class="auth-box">
      <img src="https://i.ibb.co/6rTj1Xy/logo.png" alt="Logo" class="logo"> <!-- Placeholder logo or Text -->
      <h1>WhatsHappen</h1>

      <div class="form-group">
        <input type="email" id="login-email" placeholder="Email" />
      </div>
      <div class="form-group">
        <input type="password" id="login-code" placeholder="Code (ou Mot de passe Admin)" />
      </div>
      <button class="btn-primary" onclick="app.login()">Connexion</button>
      <div class="link" onclick="app.nav('register')">Pas de compte ? S'inscrire</div>
    </div>
  </div>

  <!-- VIEW: REGISTER -->
  <div id="view-register" class="view">
    <div class="auth-box">
      <h1>Inscription</h1>
      <p>Vos données sont cryptées. Email visible uniquement par l'admin.</p>

      <div class="form-group">
        <input type="text" id="reg-firstname" placeholder="Prénom (Visible)" />
      </div>
      <div class="form-group">
        <input type="email" id="reg-email" placeholder="Email (Privé)" />
      </div>
      <div class="form-group">
        <input type="password" id="reg-code" placeholder="Créez votre Code Secret" />
      </div>
      <button class="btn-primary" onclick="app.register()">S'inscrire</button>
      <div class="link" onclick="app.nav('login')">Retour Connexion</div>
    </div>
  </div>

  <!-- VIEW: DASHBOARD (CHAT LIST) -->
  <div id="view-dashboard" class="view">
    <div class="header">
      <div class="header-left">
        <img id="main-logo-btn" src="https://i.ibb.co/6rTj1Xy/logo.png" alt="Logo" class="logo-header hidden" onclick="app.nav('admin')">
        <div class="title">WhatsHappen</div>
      </div>
      <div class="actions">
        <button onclick="app.refreshChats()">Actualiser</button>
        <button onclick="app.logout()">Déco</button>
      </div>
    </div>

    <div class="main-content">
      <button id="btn-create-chat" class="btn-new-chat hidden" onclick="app.showNewChatModal()">+ Nouvelle Conversation</button>

      <div id="chat-list" class="list-container">
        <!-- Chat Items Injected Here -->
      </div>
    </div>
  </div>

  <!-- VIEW: CONVERSATION -->
  <div id="view-conversation" class="view">
    <div class="header">
      <button class="back-btn" onclick="app.nav('dashboard')">←</button>
      <div class="chat-info">
        <span id="chat-names">Participants</span>
        <span id="chat-timer">--:--</span>
      </div>
      <div class="actions">
        <button onclick="app.refreshMessages()">↻</button>
      </div>
    </div>

    <div id="message-container" class="messages-area">
      <!-- Messages Injected Here -->
    </div>

    <div class="input-area">
      <input type="file" id="file-input" class="hidden" onchange="app.handleFileUpload(this)">
      <button class="btn-icon" onclick="document.getElementById('file-input').click()">📎</button>
      <input type="text" id="msg-input" placeholder="Message..." onkeypress="if(event.key==='Enter') app.sendMessage()">
      <button class="btn-send" onclick="app.sendMessage()">➤</button>
    </div>
  </div>

  <!-- VIEW: ADMIN -->
  <div id="view-admin" class="view">
    <div class="header">
      <button class="back-btn" onclick="app.nav('dashboard')">←</button>
      <div class="title">Admin ChaouiEngage</div>
    </div>
    <div class="main-content">
      <h3>Utilisateurs</h3>
      <div id="admin-user-list" class="list-container"></div>
    </div>
  </div>

  <!-- MODAL: NEW CHAT -->
  <div id="modal-new-chat" class="modal hidden">
    <div class="modal-content">
      <h3>Nouvelle Conversation</h3>
      <input type="text" id="new-chat-emails" placeholder="Emails des participants (séparés par virgule)">
      <select id="new-chat-duration">
        <option value="10min">10 Minutes</option>
        <option value="12h">12 Heures</option>
        <option value="24h">24 Heures</option>
        <option value="48h">48 Heures</option>
        <option value="unlimited">Illimité</option>
      </select>
      <div class="modal-actions">
        <button onclick="app.hideModal('modal-new-chat')">Annuler</button>
        <button class="btn-primary" onclick="app.createChat()">Créer</button>
      </div>
    </div>
  </div>

</div>

<?!= include('JS'); ?>
</body>
</html>
