<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utilitaire - Testament</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
  <div class="container" id="app" style="display:none;padding-top:20px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <h2 style="color:#457b9d;margin:0;"><i class="fas fa-scroll"></i> Dernières Volontés</h2>
      <button id="p-t"><i class="fas fa-file-pdf"></i> Télécharger PDF</button>
    </div>
    <div class="card" id="e-c">
      <h3 style="font-size:1.1rem;color:#457b9d;margin-bottom:15px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:10px;">Identité</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;color:#ccc;">
        <div><strong>Nom:</strong> <span id="t-n"></span></div>
        <div><strong>Prénom:</strong> <span id="t-p"></span></div>
        <div><strong>Date de naissance:</strong> <span id="t-dn"></span></div>
        <div><strong>Lieu de naissance:</strong> <span id="t-ln"></span></div>
        <div><strong>Nationalité:</strong> <span id="t-nat"></span></div>
        <div><strong>Adresse:</strong> <span id="t-a"></span></div>
      </div>
    </div>
    <div class="card" id="c-c" style="background:#fff;color:#000;padding:40px;min-height:400px;font-family:Arial,sans-serif;line-height:1.6;"></div>
    <p id="t-m" style="text-align:right;color:#888;font-size:0.9rem;"></p>
  </div>
  <script src="js/api.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/testament.js"></script>
</body>
</html>
