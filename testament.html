<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utilitaire</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="admin-header" style="background:#555;">
      <div class="logo-text"><i class="fas fa-scroll"></i> Testament</div>
      <div class="d-flex gap-2">
        <button id="btn-pdf" class="info" style="width:auto;"><i class="fas fa-file-pdf"></i> PDF</button>
        <button id="btn-logout" class="danger" style="width:auto; background:rgba(0,0,0,0.2);">Quitter</button>
      </div>
    </div>

    <div class="card mb-4" id="pdf-content" style="background:#fff; color:#000; padding:40px;">
      <h2 style="text-align:center; text-decoration:underline; margin-bottom:40px;">TESTAMENT — DERNIÈRES VOLONTÉS</h2>

      <div style="margin-bottom:30px; line-height:1.8;">
        Je soussigné(e) <strong id="t-nom-prenom"></strong>,<br>
        Né(e) le <span id="t-dateN"></span> à <span id="t-lieuN"></span><br>
        De nationalité <span id="t-nat"></span><br>
        Demeurant au <span id="t-adresse"></span><br><br>
        Rédige les présentes volontés librement et en pleine possession de mes moyens, le <strong id="t-dateNow"></strong>.
      </div>

      <div id="t-content" style="margin-bottom:50px; text-align:justify; line-height:1.6;"></div>

      <div style="text-align:right; margin-top:50px;">
        <p>Signature :</p>
        <div style="width:200px; height:80px; border-bottom:1px dashed #000; display:inline-block; margin-top:20px;"></div>
      </div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/testament.js"></script>
</body>
</html>
