<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prononciation - English Mastery</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body class="page-enter">
  <header class="page-header flex items-center justify-between">
    <a href="exercises.html" class="btn btn-icon btn-ghost" aria-label="Retour aux exercices"><i class="fas fa-arrow-left"></i></a>
    <div class="font-bold">Prononciation</div>
    <div class="badge badge-a2">A2.1</div>
  </header>
  <main class="container text-center">
    <h2 class="mb-4">Minimal Pairs</h2>
    <div class="card p-6" style="max-width:400px; margin:0 auto;">
      <div class="flex justify-around mb-6" style="font-size:2rem; font-weight:bold;">
        <div onclick="speech.speak('ship')" style="cursor:pointer; padding:10px; border:1px solid var(--border); border-radius:8px;">Ship<br><span class="text-sm font-mono text-muted">/ʃɪp/</span></div>
        <div onclick="speech.speak('sheep')" style="cursor:pointer; padding:10px; border:1px solid var(--border); border-radius:8px;">Sheep<br><span class="text-sm font-mono text-muted">/ʃiːp/</span></div>
      </div>
      <p class="text-secondary text-sm">Cliquez pour écouter la différence</p>
    </div>
  </main>
  <script src="app.js"></script><script src="speech.js"></script>
</body>
</html>
