<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urgence - Utilitaire</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="emergency-body">
<div class="emergency-layout">
<header class="emergency-header">
<div class="header-left">
<i class="fas fa-ambulance"></i>
<h1>Contacts d'Urgence</h1>
</div>
<div class="header-right">
<button id="btn-panic" class="btn-danger"><i class="fas fa-exclamation-triangle"></i> Alerte Panique Niveau 1</button>
<button id="btn-logout" class="btn-secondary btn-sm ml-2"><i class="fas fa-sign-out-alt"></i></button>
</div>
</header>
<main class="emergency-main">
<div id="loading-overlay" class="loading-overlay">
<i class="fas fa-spinner fa-spin"></i>
<p>Chargement...</p>
</div>
<div id="emergency-message-container" class="card emergency-message-card hidden mb-4">
<h3><i class="fas fa-info-circle"></i> Message Important</h3>
<p id="emergency-message-text"></p>
</div>
<div class="search-bar-container mb-4">
<input type="text" id="search-contacts" placeholder="Rechercher un contact..." class="search-input w-100">
</div>
<div id="contacts-list" class="contacts-grid"></div>
</main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script src="js/api.js"></script>
<script src="js/crypto.js"></script>
<script src="js/utils.js"></script>
<script src="js/emergency.js"></script>
</body>
</html>
